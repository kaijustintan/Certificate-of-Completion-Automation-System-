<!-- Dashboard.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: Dashboard.html  (page — requestor view)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang "My Requests" page ng requestor. Makikita dito lahat ng request
  na isinumite niya, may quick stats (total, in-progress, approved, declined),
  at pwedeng mag-filter at mag-sort. Ang mga stat cards ay clickable —
  pag pinindot, nafi-filter agad ang listahan. Lahat ng filtering/sorting
  ay client-side (iisang server call lang sa load).

  TECHNICAL:
  Single callServer('getMyRequests') on load; all filter/sort done client-side
  from cached _dashboardRequests. Stat cards are clickable filters.

  FUNCTIONS:
    - renderDashboardPage()          main page renderer
    - renderDashboardControls()      filter-bar HTML (status + sort dropdowns)
    - afterRender_dashboard()        hook: sync active stat card on first render
    - dashboardStatClick(filter)     stat card click handler
    - syncDashboardStatCards()       highlights the active filter's stat card
    - dashboardFilterChange(el)      status dropdown change
    - dashboardSortChange(el)        sort dropdown change
    - applyDashboardView()           filter + sort + re-render #dashboard-list
    - computeDashboardTabCounts()    {all,pending,approved,returned,declined,expired} counts
    - getDashboardFilter(status)     status string → filter bucket key
    - computeRequestorStats()        {total,pending,approved,declined,expired} for stat grid
    - renderRequestorTable()         <table> HTML for request rows
-->


<script>
// Cached after each server fetch so filter/sort work without re-fetching.
let _dashboardRequests      = [];
let _dashboardCurrentFilter = 'all';
let _dashboardCurrentSort   = 'newest';

/*
  Function Name: renderDashboardPage
  LAYMAN    : I-load ang lahat ng request ng naka-login na user at ipakita ang
              buong requestor dashboard — stat cards, filter/sort controls, at
              ang listahan.
  TECHNICAL : Awaits getMyRequests(); resets filter/sort state; returns full
              page HTML including 4 clickable stat cards and #dashboard-list.
  RETURNS   : HTML string.
*/
async function renderDashboardPage() {
  _dashboardRequests      = await callServer('getMyRequests');
  _dashboardCurrentFilter = 'all';
  _dashboardCurrentSort   = 'newest';

  const stats = computeRequestorStats(_dashboardRequests);

  const initialList = _dashboardRequests.length === 0
    ? renderEmptyState({
        title:   'No requests yet',
        message: 'Submit your first e-certificate request to see it here.',
        emotion: 'default',
      })
    : renderRequestorTable(sortRequests(_dashboardRequests, 'newest'));

  return `
    <div class="page-header">
      <div>
        <div class="page-title">My requests</div>
        <div class="page-subtitle">Every e-certificate request you have submitted.</div>
      </div>
      <button class="btn btn-primary" onclick="navigateTo('new')">+ New request</button>
    </div>

    ${renderMiga('welcome', 'Welcome back! Here\'s where your requests live. Click any row to see its full history.')}

    <div class="stat-grid">
      <div class="stat-card clickable" data-filter="all" onclick="dashboardStatClick('all')">
        <div class="stat-number">${stats.total}</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card clickable" data-filter="pending" onclick="dashboardStatClick('pending')">
        <div class="stat-number blue">${stats.pending}</div>
        <div class="stat-label">In progress</div>
      </div>
      <div class="stat-card clickable" data-filter="approved" onclick="dashboardStatClick('approved')">
        <div class="stat-number green">${stats.approved}</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat-card clickable" data-filter="declined" onclick="dashboardStatClick('declined')">
        <div class="stat-number red">${stats.declined}</div>
        <div class="stat-label">Declined</div>
      </div>
      <div class="stat-card clickable" data-filter="expired" onclick="dashboardStatClick('expired')">
        <div class="stat-number red">${stats.expired}</div>
        <div class="stat-label">Expired</div>
      </div>
    </div>

    <div class="card">
      <div id="dashboard-controls">
        ${renderDashboardControls(_dashboardRequests)}
      </div>
      <div id="dashboard-list">
        ${initialList}
      </div>
    </div>
  `;
}


// ─── Filter + sort controls ───────────────────────────────

/*
  Function Name: renderDashboardControls
  LAYMAN    : Gumawa ng HTML para sa Status dropdown at Sort by dropdown.
              Kasama ang count per status bucket sa bawat option.
  TECHNICAL : Builds .filter-bar with two .filter-select elements; options
              seeded from current _dashboardCurrentFilter and _dashboardCurrentSort.
  PARAMS    : requests — the full request list (used for counts).
  RETURNS   : HTML string — the .filter-bar div.
*/
function renderDashboardControls(requests) {
  const counts = computeDashboardTabCounts(requests);
  const filterOptions = [
    { value: 'all',      label: 'All'      },
    { value: 'pending',  label: 'Pending'  },
    { value: 'approved', label: 'Approved' },
    { value: 'returned', label: 'Returned' },
    { value: 'declined', label: 'Declined' },
    { value: 'expired',  label: 'Expired'  }, // #10 — contract end date lapsed (any status)
  ];
  const sortOptions = [
    { value: 'newest',  label: 'Most Recent'  },
    { value: 'oldest',  label: 'Oldest First' },
    { value: 'project', label: 'Project A→Z' },
    { value: 'group',   label: 'Group A→Z'   },
  ];

  const filterHtml = filterOptions.map(function (o) {
    return '<option value="' + o.value + '"' +
      (o.value === _dashboardCurrentFilter ? ' selected' : '') + '>' +
      o.label + ' (' + counts[o.value] + ')</option>';
  }).join('');

  const sortHtml = sortOptions.map(function (o) {
    return '<option value="' + o.value + '"' +
      (o.value === _dashboardCurrentSort ? ' selected' : '') + '>' +
      o.label + '</option>';
  }).join('');

  return '<div class="filter-bar">' +
    '<div class="filter-group">' +
      '<label class="filter-label">Status</label>' +
      '<select class="filter-select" onchange="dashboardFilterChange(this)">' + filterHtml + '</select>' +
    '</div>' +
    '<div class="filter-group">' +
      '<label class="filter-label">Sort by</label>' +
      '<select class="filter-select" onchange="dashboardSortChange(this)">' + sortHtml + '</select>' +
    '</div>' +
  '</div>';
}

function dashboardFilterChange(el) {
  _dashboardCurrentFilter = el.value;
  applyDashboardView();
}

function dashboardSortChange(el) {
  _dashboardCurrentSort = el.value;
  applyDashboardView();
}

/*
  Function Name: afterRender_dashboard
  LAYMAN    : Tinatawag ng router pagkatapos ma-render ang dashboard para
              ma-highlight agad ang tamang stat card (default: "All").
  TECHNICAL : afterRender hook (called by navigateTo); just calls syncDashboardStatCards().
*/
function afterRender_dashboard() {
  syncDashboardStatCards();
}

/*
  Function Name: dashboardStatClick
  LAYMAN    : Kapag pinindot ang isang stat card, i-set ang filter at i-sync
              ang dropdown at ang highlight ng card.
  TECHNICAL : Sets _dashboardCurrentFilter; updates dropdown .value; calls applyDashboardView.
  PARAMS    : filter — one of 'all' | 'pending' | 'approved' | 'declined'.
*/
function dashboardStatClick(filter) {
  _dashboardCurrentFilter = filter;
  const sel = document.querySelector('#dashboard-controls .filter-select');
  if (sel) sel.value = filter;
  applyDashboardView();
}

/*
  Function Name: syncDashboardStatCards
  LAYMAN    : I-update ang highlight ng stat cards para sa active filter.
  TECHNICAL : Queries .stat-card[data-filter]; adds/removes .active matching
              _dashboardCurrentFilter. ('returned' has no stat card → all cards unhighlighted.)
*/
function syncDashboardStatCards() {
  const cards = document.querySelectorAll('.stat-card[data-filter]');
  cards.forEach(function (card) {
    if (card.getAttribute('data-filter') === _dashboardCurrentFilter) {
      card.classList.add('active');
    } else {
      card.classList.remove('active');
    }
  });
}

/*
  Function Name: applyDashboardView
  LAYMAN    : I-re-render ang listahan base sa kasalukuyang filter at sort.
              Tinatawag pagkatapos ng anumang change sa filter, sort, o stat card.
  TECHNICAL : Syncs stat cards → filters _dashboardRequests → sorts →
              updates #dashboard-list innerHTML (table or empty state).
*/
function applyDashboardView() {
  syncDashboardStatCards();
  const filtered = _dashboardCurrentFilter === 'all'
    ? _dashboardRequests
    : _dashboardCurrentFilter === 'expired'
      // #10 — expired is a cross-cutting flag, not a status bucket.
      ? _dashboardRequests.filter(function (r) { return r.isExpired; })
      : _dashboardRequests.filter(function (r) {
          return getDashboardFilter(r.status) === _dashboardCurrentFilter;
        });
  const sorted = sortRequests(filtered, _dashboardCurrentSort);
  const listEl = document.getElementById('dashboard-list');
  if (!listEl) return;

  if (sorted.length === 0) {
    const emptyTitles = {
      all:      'No requests yet',
      pending:  'No pending requests',
      approved: 'No approved requests',
      returned: 'No returned requests',
      declined: 'No declined requests',
      expired:  'No expired contracts',
    };
    listEl.innerHTML = renderEmptyState({
      title:   emptyTitles[_dashboardCurrentFilter] || 'No requests',
      message: _dashboardCurrentFilter === 'all'
        ? 'Submit your first e-certificate request to see it here.'
        : '',
      emotion: _dashboardCurrentFilter === 'approved' ? 'approved'
             : _dashboardCurrentFilter === 'declined' ? 'declined'
             : 'default',
    });
  } else {
    listEl.innerHTML = renderRequestorTable(sorted);
  }
}


// ─── Tab count helper (reused for dropdown option labels) ─

/*
  Function Name: computeDashboardTabCounts
  LAYMAN    : Bilang ng requests sa bawat bucket para ipakita sa dropdown options.
              Ang "expired" ay hiwalay na bilang — cross-cutting sa status (isang
              request ay pwedeng Pending AT expired sabay).
  TECHNICAL : Returns {all, pending, approved, returned, declined, expired} counts.
              Status buckets via getDashboardFilter; expired via the server-computed
              r.isExpired flag (#10) — orthogonal to status, so counted separately.
*/
function computeDashboardTabCounts(requests) {
  const counts = { all: 0, pending: 0, approved: 0, returned: 0, declined: 0, expired: 0 };
  for (const r of requests) {
    counts.all++;
    counts[getDashboardFilter(r.status)]++;
    if (r.isExpired) counts.expired++;
  }
  return counts;
}

/*
  Function Name: getDashboardFilter
  LAYMAN    : Anong bucket ang status na ito? Ginagamit sa pag-filter at sa
              pagbibilang ng tabs. Lahat ng "Pending Approver N" + "Syncing Files"
              ay mapupunta sa 'pending' para walang mawala.
  TECHNICAL : Maps status string → 'approved' | 'declined' | 'returned' | 'pending'.
              Shared with ApproverDashboard.html and JavaScript.html.
*/
// Maps a status string to one of the 4 filter bucket keys.
function getDashboardFilter(status) {
  if (status === 'Fully Approved')        return 'approved';
  if (status === 'Declined')              return 'declined';
  if (status === 'Returned to Requestor') return 'returned';
  return 'pending'; // Pending Approver 1/2/3 + Syncing Files
}


// ─── Stats + table ────────────────────────────────────────

/*
  Function Name: computeRequestorStats
  LAYMAN    : Bilang para sa stat grid — total, in-progress, approved, declined,
              expired. NOTE: "returned" ay hindi hiwalay na stat dito (kasama sa
              pending). Ang "expired" ay cross-cutting — kahit anong status, bibilangin
              kung lapsed na ang contract (#10).
  TECHNICAL : Counts total, approved (Fully Approved), declined, everything-else as
              pending, plus an orthogonal expired count from the server isExpired flag.
*/
function computeRequestorStats(requests) {
  const stats = { total: 0, pending: 0, approved: 0, declined: 0, expired: 0 };
  for (const r of requests) {
    stats.total++;
    if (r.status === 'Fully Approved')      stats.approved++;
    else if (r.status === 'Declined')       stats.declined++;
    else                                    stats.pending++;
    if (r.isExpired)                        stats.expired++;
  }
  return stats;
}

/*
  Function Name: renderRequestorTable
  LAYMAN    : Gumawa ng HTML table na may lahat ng requests na ipinasa.
              Bawat row ay clickable — mapupunta sa request detail page.
              Kung lapsed na ang contract, may maliit na gray na "Expired" chip
              sa tabi ng status badge (#10).
  TECHNICAL : Returns a .data-table HTML string; each <tr> has onclick
              navigateTo('request',{id}). Expired chip driven by the
              server-computed r.isExpired flag — no client date parsing.
*/
function renderRequestorTable(requests) {
  const rows = requests.map(function (r) {
    const idAttr = escapeHtml(r.requestId);
    return '' +
      '<tr onclick="navigateTo(\'request\', {id: \'' + idAttr + '\'})">' +
        '<td>' + escapeHtml(r.controlNumber) + '</td>' +
        '<td>' + escapeHtml(r.projectTitle)  + '</td>' +
        '<td>' + escapeHtml(r.group)         + '</td>' +
        '<td>' + renderStatusBadge(r.status) +
          (r.isExpired ? ' <span class="badge badge-expired" title="Contract end date has passed">Expired</span>' : '') +
        '</td>' +
        '<td>' + escapeHtml(r.dateFiled)     + '</td>' +
      '</tr>';
  }).join('');

  return '' +
    '<table class="data-table">' +
      '<thead><tr>' +
        '<th>Control no.</th>' +
        '<th>Project</th>' +
        '<th>Group</th>' +
        '<th>Status</th>' +
        '<th>Filed</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}
</script>
