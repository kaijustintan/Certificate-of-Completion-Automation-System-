<!-- ApproverDashboard.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: ApproverDashboard.html  (page — approver view)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang "My Approvals" page ng approver. Dalawang listahan: (1) mga
  naghihintay ng kanyang aksyon ("Awaiting"), at (2) mga ginawa na niya
  noon ("Actioned by you"). May 4 stat cards na clickable — pag pinindot,
  diretso sa tamang view + status filter. Sa Actioned view, may additional
  Status dropdown para ma-filter by Approved/Declined/Returned.

  TECHNICAL:
  Both datasets fetched in parallel (Promise.all) on page entry — no lazy
  loading — so the stat grid has all 4 counts immediately. All filtering/
  sorting is client-side from the caches.

  FUNCTIONS:
    - renderApproverDashboardPage()         main renderer; parallel fetch
    - renderApproverControls()              view + sort + conditional status dropdowns
    - computeApproverActionedCounts()       {all,approved,declined,returned,expired} for status dropdown
    - afterRender_approverDashboard()       hook: sync active stat card
    - approverTabClick(view)               Awaiting/Actioned tab switch
    - approverSortChange(el)               sort dropdown change
    - approverActionedStatusChange(el)     status sub-filter change
    - approverStatClick(view, status)      stat card click handler
    - approverSearch / approverGoPage      list search + pagination (list-only)
    - syncApproverStatCards()              highlights active stat card
    - applyApproverView()                  re-render controls + list
    - applyApproverList()                  re-render ONLY the list (search/paging)
    - buildApproverListHtml()              list body: view+search+sort+paginate
    - renderApproverListBody()             initial-render entry for the list
    - renderApproverTable(rows)            shared <table> HTML renderer
-->


<script>
let _approverPendingCache   = [];
let _approverActionedCache  = [];
let _approverCurrentView    = 'awaiting';
let _approverCurrentSort    = 'newest';
let _approverActionedStatus = 'all'; // 'all' | 'approved' | 'declined' | 'returned' (actioned view only)
let _approverSearch         = '';
let _approverPage           = 1;
const APPROVER_PER_PAGE     = 8;

/*
  Function Name: renderApproverDashboardPage
  LAYMAN    : I-load ang dalawang listahan (pending + actioned) nang sabay-sabay
              para kumpleto agad ang 4 stat cards pagkakita ng page.
  TECHNICAL : Promise.all([getPendingApprovals, getMyActionedRequests]); computes
              4 stat counts; returns full page HTML with clickable stat grid and
              #approver-controls + #approver-list slots.
  RETURNS   : HTML string.
*/
async function renderApproverDashboardPage() {
  // Pre-load both in parallel so stat grid is complete from the start.
  [_approverPendingCache, _approverActionedCache] = await Promise.all([
    callServer('getPendingApprovals'),
    callServer('getMyActionedRequests'),
  ]);
  _approverCurrentView    = 'awaiting';
  _approverCurrentSort    = 'newest';
  _approverActionedStatus = 'all';
  _approverSearch         = '';
  _approverPage           = 1;

  const awaitingCount = _approverPendingCache.length;
  const approvedCount = _approverActionedCache.filter(function (r) { return r.status === 'Fully Approved'; }).length;
  const declinedCount = _approverActionedCache.filter(function (r) { return r.status === 'Declined'; }).length;
  const returnedCount = _approverActionedCache.filter(function (r) { return r.status === 'Returned to Requestor'; }).length;
  // #10 — expired among requests you've actioned (matches the Expired sub-filter,
  // which scopes to the Actioned view). An awaiting request that happens to be
  // expired still shows its red chip in the list; it's just not counted here.
  const expiredCount  = _approverActionedCache.filter(function (r) { return r.isExpired; }).length;

  const statCards = renderStatGrid([
    { icon: 'inbox',        tone: 'blue',  value: awaitingCount, label: 'Awaiting Your Approval',
      statKey: 'awaiting',  clickFn: "approverStatClick('awaiting','all')",
      sub: awaitingCount ? 'Needs your action' : 'Inbox zero', subDir: awaitingCount ? 'flat' : 'up' },
    { icon: 'check-circle', tone: 'green', value: approvedCount, label: 'Approved by You',
      statKey: 'approved',  clickFn: "approverStatClick('actioned','approved')",
      sub: 'Signed off', subDir: 'flat' },
    { icon: 'x-circle',     tone: 'red',   value: declinedCount, label: 'Declined by You',
      statKey: 'declined',  clickFn: "approverStatClick('actioned','declined')",
      sub: 'Closed out', subDir: 'flat' },
    { icon: 'return',       tone: 'amber', value: returnedCount, label: 'Returned by You',
      statKey: 'returned',  clickFn: "approverStatClick('actioned','returned')",
      sub: 'Sent back', subDir: 'flat' },
    { icon: 'alert',        tone: 'amber', value: expiredCount,  label: 'Expired',
      statKey: 'expired',   clickFn: "approverStatClick('actioned','expired')",
      sub: expiredCount ? 'Contracts lapsed' : 'None expired', subDir: expiredCount ? 'down' : 'flat' },
  ]);

  return `
    <div class="page-header">
      <div>
        <div class="page-title">My approvals</div>
        <div class="page-subtitle">Your approval queue and history.</div>
      </div>
    </div>

    ${renderHeroCard({
      greeting: 'Your approval desk,',
      title:    awaitingCount === 0
        ? 'Inbox zero, ' + friendlyName(state.user && state.user.email)
        : friendlyName(state.user && state.user.email) + ', you have ' + awaitingCount + ' to review',
      subtitle: awaitingCount === 0
        ? 'Nothing is waiting on you right now. Nicely done.'
        : 'Approve, decline, or return each request from its review page.',
      insights: [
        { icon: 'inbox',        text: awaitingCount + ' awaiting' },
        { icon: 'check-circle', text: approvedCount + ' approved' },
      ],
      emotion: 'pending',
    })}

    ${statCards}

    <div class="card">
      <div class="card-header"><div class="card-title">Requests</div></div>
      <div id="approver-controls">
        ${renderApproverControls()}
      </div>
      <div id="approver-list">
        ${renderApproverListBody()}
      </div>
    </div>
  `;
}


// ─── View + sort controls ─────────────────────────────────

/*
  Function Name: renderApproverControls
  LAYMAN    : Gumawa ng controls: dalawang TAB sa taas (Awaiting / Actioned,
              may bilang bawat isa), tapos filter bar sa ilalim. Kapag
              "Actioned" ang aktibong tab, lalabas pa ang Status dropdown na
              may count bawat outcome (Approved/Declined/Returned/All).
  TECHNICAL : Renders .tab-row (view switch — was a <select>; same state var
              _approverCurrentView, same applyApproverView flow) + .filter-bar;
              conditionally adds status group when _approverCurrentView ===
              'actioned'. Tab counts come from the two caches. Seeded from
              current state vars.
*/
function renderApproverControls() {
  const sortOptions = [
    { value: 'newest',  label: 'Most Recent'  },
    { value: 'oldest',  label: 'Oldest First' },
    { value: 'project', label: 'Project A→Z' },
    { value: 'group',   label: 'Group A→Z'   },
  ];

  // View switch as tabs with count badges (reuses the .tab/.tab-count CSS).
  function tab(view, label, count) {
    const active = (view === _approverCurrentView) ? ' active' : '';
    return '<div class="tab' + active + '" role="button" tabindex="0"' +
      ' onclick="approverTabClick(\'' + view + '\')" onkeydown="uiKeyActivate(event)">' +
      label + '<span class="tab-count">' + count + '</span>' +
    '</div>';
  }
  const tabRow =
    '<div class="tab-row">' +
      tab('awaiting', 'Awaiting your action', _approverPendingCache.length) +
      tab('actioned', 'Actioned by you',      _approverActionedCache.length) +
    '</div>';

  const sortHtml = sortOptions.map(function (o) {
    return '<option value="' + o.value + '"' +
      (o.value === _approverCurrentSort ? ' selected' : '') + '>' + o.label + '</option>';
  }).join('');

  // Status sub-filter only applies to the "Actioned by you" view.
  let statusGroup = '';
  if (_approverCurrentView === 'actioned') {
    const counts = computeApproverActionedCounts();
    const statusOptions = [
      { value: 'all',      label: 'All'      },
      { value: 'approved', label: 'Approved' },
      { value: 'declined', label: 'Declined' },
      { value: 'returned', label: 'Returned' },
      { value: 'expired',  label: 'Expired'  }, // #10 — contract end date lapsed (any status)
    ];
    const statusHtml = statusOptions.map(function (o) {
      return '<option value="' + o.value + '"' +
        (o.value === _approverActionedStatus ? ' selected' : '') + '>' +
        o.label + ' (' + counts[o.value] + ')</option>';
    }).join('');
    statusGroup =
      '<div class="filter-group">' +
        '<label class="filter-label" for="approver-status-filter">Status</label>' +
        '<select class="filter-select" id="approver-status-filter" onchange="approverActionedStatusChange(this)">' + statusHtml + '</select>' +
      '</div>';
  }

  return tabRow +
    '<div class="controls-bar">' +
      renderSearchBar({
        id:          'approver-search',
        onInput:     'approverSearch',
        value:       _approverSearch,
        placeholder: 'Search by control no., project, requestor…',
      }) +
      '<div class="filter-bar">' +
        statusGroup +
        '<div class="filter-group">' +
          '<label class="filter-label">Sort by</label>' +
          '<select class="filter-select" onchange="approverSortChange(this)">' + sortHtml + '</select>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/*
  Function Name: computeApproverActionedCounts
  LAYMAN    : Para sa Status dropdown, bilangin kung ilan ang approved, declined,
              returned, expired, at lahat sa actioned cache. Ang "expired" ay
              hiwalay na bilang — cross-cutting sa status (#10).
  TECHNICAL : Iterates _approverActionedCache; status buckets via getDashboardFilter;
              expired via the server-computed r.isExpired flag. Returns
              {all, approved, declined, returned, expired}.
*/
function computeApproverActionedCounts() {
  const counts = { all: 0, approved: 0, declined: 0, returned: 0, expired: 0 };
  for (const r of _approverActionedCache) {
    counts.all++;
    const bucket = getDashboardFilter(r.status);
    if (counts[bucket] !== undefined) counts[bucket]++;
    if (r.isExpired) counts.expired++;
  }
  return counts;
}

/*
  Function Name: approverTabClick
  LAYMAN    : Pinindot ang isa sa dalawang tab (Awaiting / Actioned) —
              palitan ang view at i-refresh ang listahan.
  TECHNICAL : Replaces the old approverViewChange(el) dropdown handler;
              takes the view string directly from the tab's onclick.
  PARAMS    : view — 'awaiting' | 'actioned'.
*/
function approverTabClick(view) {
  _approverCurrentView = view;
  if (_approverCurrentView === 'awaiting') _approverActionedStatus = 'all';
  _approverPage = 1;
  applyApproverView();
}

function approverSortChange(el) {
  _approverCurrentSort = el.value;
  _approverPage = 1;
  applyApproverView();
}

function approverActionedStatusChange(el) {
  _approverActionedStatus = el.value;
  _approverPage = 1;
  applyApproverView();
}

/*
  Function Name: approverSearch
  LAYMAN    : Live search sa kasalukuyang listahan (awaiting o actioned). Hindi
              nire-render ang controls kaya hindi nawawala ang focus.
  TECHNICAL : Sets _approverSearch, resets page, re-renders ONLY #approver-list
              via applyApproverList (search input in #approver-controls untouched).
  PARAMS    : value — raw input string.
*/
function approverSearch(value) {
  _approverSearch = value;
  _approverPage = 1;
  applyApproverList();
}

/*
  Function Name: approverGoPage
  LAYMAN    : Lumipat ng page sa kasalukuyang listahan.
  TECHNICAL : Sets _approverPage; re-renders only the list.
  PARAMS    : n — 1-based page.
*/
function approverGoPage(n) {
  _approverPage = n;
  applyApproverList();
}

/*
  Function Name: afterRender_approverDashboard
  LAYMAN    : Hook ng router para ma-highlight agad ang "Awaiting" stat card sa simula.
  TECHNICAL : afterRender hook; calls syncApproverStatCards().
*/
function afterRender_approverDashboard() {
  syncApproverStatCards();
}

/*
  Function Name: approverStatClick
  LAYMAN    : Pag pinindot ang stat card, diretso sa tamang view at status filter.
              "Awaiting" card → awaiting view; "Approved/Declined/Returned" cards
              → actioned view + the matching status.
  TECHNICAL : Sets _approverCurrentView + _approverActionedStatus; calls applyApproverView.
  PARAMS    : view — 'awaiting' | 'actioned'; status — 'all' | 'approved' | 'declined' | 'returned'.
*/
function approverStatClick(view, status) {
  _approverCurrentView    = view;
  _approverActionedStatus = status || 'all';
  _approverPage = 1;
  applyApproverView();
}

/*
  Function Name: syncApproverStatCards
  LAYMAN    : I-highlight ang tamang stat card depende sa active view/status.
  TECHNICAL : Queries .stat-card[data-statkey]; key is 'awaiting' for the awaiting
              view, or the status bucket key for the actioned sub-filters.
*/
function syncApproverStatCards() {
  const activeKey = _approverCurrentView === 'awaiting' ? 'awaiting' : _approverActionedStatus;
  const cards = document.querySelectorAll('.stat-card[data-statkey]');
  cards.forEach(function (card) {
    if (card.getAttribute('data-statkey') === activeKey) {
      card.classList.add('active');
    } else {
      card.classList.remove('active');
    }
  });
}

/*
  Function Name: applyApproverView
  LAYMAN    : Mag-re-render ng controls at listahan base sa kasalukuyang view/sort/status.
              Tinatawag pagkatapos ng anumang stat card click o dropdown change.
  TECHNICAL : Re-renders #approver-controls (so Status dropdown appears/disappears);
              syncs stat cards; builds the filtered + sorted rows from the correct cache;
              updates #approver-list innerHTML.
*/
/*
  Function Name: buildApproverListHtml
  LAYMAN    : Buuin ang HTML ng kasalukuyang listahan — piliin ang tamang cache
              (awaiting o actioned + status), i-search, i-sort, i-page, tapos
              gawing table + pagination. Kung wala → empty state.
  TECHNICAL : Single source of truth for the #approver-list body. View/status
              filter → search → sort → paginate. Returns a string (no DOM write).
  RETURNS   : HTML string.
*/
function buildApproverListHtml() {
  let rows;
  if (_approverCurrentView === 'awaiting') {
    rows = _approverPendingCache;
  } else if (_approverActionedStatus === 'all') {
    rows = _approverActionedCache;
  } else if (_approverActionedStatus === 'expired') {
    // #10 — expired is a cross-cutting flag, not a status bucket.
    rows = _approverActionedCache.filter(function (r) { return r.isExpired; });
  } else {
    rows = _approverActionedCache.filter(function (r) {
      return getDashboardFilter(r.status) === _approverActionedStatus;
    });
  }

  const searched = filterBySearch(rows, _approverSearch);
  const sorted   = sortRequests(searched, _approverCurrentSort);

  if (sorted.length === 0) {
    if (_approverSearch) {
      return renderEmptyState({
        title:   'No matches',
        message: 'No requests match “' + escapeHtml(_approverSearch) + '”.',
        emotion: 'default',
      });
    }
    return _approverCurrentView === 'awaiting'
      ? renderEmptyState({ title: 'All caught up', message: 'Nothing is currently waiting for your approval.', emotion: 'approved' })
      : renderEmptyState({ title: 'No history yet', message: 'Requests you have approved, declined, or returned will appear here.', emotion: 'default' });
  }

  const pages = Math.max(1, Math.ceil(sorted.length / APPROVER_PER_PAGE));
  if (_approverPage > pages) _approverPage = pages;
  const slice = paginate(sorted, _approverPage, APPROVER_PER_PAGE);
  return renderApproverTable(slice) +
    renderPagination({ total: sorted.length, page: _approverPage, perPage: APPROVER_PER_PAGE, onPage: 'approverGoPage' });
}

// Initial render entry (called by renderApproverDashboardPage).
function renderApproverListBody() { return buildApproverListHtml(); }

/*
  Function Name: applyApproverList
  LAYMAN    : I-update LANG ang listahan (hindi ang controls) — gamit sa search
              at pagination para hindi mawala ang focus sa search box.
  TECHNICAL : Re-renders #approver-list only (+ fade). No controls re-render.
*/
function applyApproverList() {
  const listEl = document.getElementById('approver-list');
  if (!listEl) return;
  listEl.innerHTML = buildApproverListHtml();
  listEl.classList.remove('fade-in');
  void listEl.offsetWidth;
  listEl.classList.add('fade-in');
}

/*
  Function Name: applyApproverView
  LAYMAN    : I-re-render ang controls (para lumitaw/mawala ang Status dropdown)
              at ang listahan. Tinatawag sa tab / sort / status / stat changes.
  TECHNICAL : Re-renders #approver-controls + stat-card highlight, then delegates
              the list to applyApproverList(). (Search/pagination skip the
              controls re-render via applyApproverList directly.)
*/
function applyApproverView() {
  const controlsEl = document.getElementById('approver-controls');
  if (controlsEl) controlsEl.innerHTML = renderApproverControls();
  syncApproverStatCards();
  applyApproverList();
}


// ─── Shared table ─────────────────────────────────────────

/*
  Function Name: renderApproverTable
  LAYMAN    : Gumawa ng HTML table na may approver-specific columns (Control No.,
              Project, Requestor, Group, Status, Filed). Bawat row ay clickable
              papunta sa review detail page. Kung lapsed na ang contract, may
              gray na "Expired" chip sa tabi ng status badge (#10).
  TECHNICAL : Returns .data-table HTML; each <tr> onclick navigateTo('review',{id}).
              Used by both awaiting and actioned list renderers. Expired chip
              driven by the server-computed r.isExpired flag.
*/
function renderApproverTable(rows) {
  const tableRows = rows.map(function (r) {
    const idAttr = escapeHtml(r.requestId);
    return '' +
      '<tr tabindex="0" onclick="navigateTo(\'review\', {id: \'' + idAttr + '\'})" onkeydown="uiKeyActivate(event)">' +
        '<td>' +
          '<div class="cell-request">' +
            '<div class="cell-request-icon">' + renderIcon('file', 16) + '</div>' +
            '<div class="cell-request-text">' +
              '<div class="cell-primary">' + escapeHtml(r.controlNumber) + '</div>' +
            '</div>' +
          '</div>' +
        '</td>' +
        '<td class="cell-clip" title="' + escapeHtml(r.projectTitle) + '">' + escapeHtml(r.projectTitle) + '</td>' +
        '<td class="cell-clip" title="' + escapeHtml(r.requestor) + '">' + escapeHtml(r.requestor) + '</td>' +
        '<td class="cell-clip" title="' + escapeHtml(r.group) + '">' + escapeHtml(r.group) + '</td>' +
        '<td>' + renderStatusBadge(r.status) +
          (r.isExpired ? ' <span class="badge badge-expired" title="Contract end date has passed">Expired</span>' : '') +
        '</td>' +
        '<td><span class="cell-date">' + renderIcon('calendar', 14) + escapeHtml(r.dateFiled) + '</span></td>' +
        '<td class="cell-chevron">' + renderIcon('chevron-right', 18) + '</td>' +
      '</tr>';
  }).join('');

  return '' +
    '<div class="table-scroll">' +
    '<table class="data-table">' +
      '<thead><tr>' +
        '<th>Request</th>' +
        '<th>Project</th>' +
        '<th>Requestor</th>' +
        '<th>Group</th>' +
        '<th>Status</th>' +
        '<th>Filed</th>' +
        '<th></th>' +
      '</tr></thead>' +
      '<tbody>' + tableRows + '</tbody>' +
    '</table>' +
    '</div>';
}
</script>
