<!-- RequestDetail.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: RequestDetail.html  (page — requestor read-only view)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang "view your request" page ng requestor. Lahat ng field, approvers,
  attachments, at resubmit history ay makikita dito. Kung "Returned to
  Requestor" ang status, lalabas ang "Resubmit request" button. Read-only
  ang lahat ng iba pa.

  IMPORTANT — SHARED HELPERS:
  Maraming helpers na naka-define dito ay ginagamit DIN ng ReviewDetail.html.
  Apps Script shares one global scope, kaya accessible sila kahit ibang file.
  Huwag i-rename o ilipat nang hindi inuupdate ang ReviewDetail.

  TECHNICAL:
  Two-column layout (detail-layout): summary cards + attachments on the left,
  approvers chain + resubmit button on the right rail.

  SHARED HELPERS (consumed by ReviewDetail.html too):
    - getConfiguredApproverSlots(detail)   non-empty approver slots array
    - dotStateFor(slotNumber, detail)      'done'|'active'|'declined'|''
    - renderProgressSteps(detail)          step dots + connecting lines
    - renderDetailRow(key, value)          single labeled row in .detail-row
    - renderRequestSummaryCards(detail)    4 info cards (Request/Product/Contract/Purpose)
    - renderApproversChain(detail, blur)   approver chain with icons + conditional email blur
    - renderResubmitBanner(detail)         current return entry + collapsible history
    - renderAttachmentsBlock(detail, canManage)  attachments card

  PAGE FUNCTIONS:
    - renderRequestDetailPage(params)     main renderer; getRequestDetail + auth
    - onResubmitClick(requestId)          resubmit handler with confirm + loading overlay
    - toggleResubmitHistory()             expands/collapses old resubmit history
-->


<script>
// ─── SHARED HELPERS (also used by ReviewDetail) ────────────

/*
  Function Name: getConfiguredApproverSlots
  LAYMAN    : Kuhanin ang listahan ng mga approver ng request (1, 2, o 3),
              laktawan ang blangkong slots.
  TECHNICAL : Maps up to 3 approver slots from detail; omits slots where
              approver is blank. Returns [{n, approver, designation, date, remark}].
  PARAMS    : detail — the getRequestDetail DTO.
  RETURNS   : Array of configured slot objects (length 1–3).
*/
// Returns the configured approver slots for a request.
// Slots without a configured approver are omitted.
function getConfiguredApproverSlots(detail) {
  const slots = [];
  if (detail.approver1) slots.push({ n: 1, approver: detail.approver1, designation: detail.designation1, date: detail.app1Date, remark: detail.app1Remark });
  if (detail.approver2) slots.push({ n: 2, approver: detail.approver2, designation: detail.designation2, date: detail.app2Date, remark: detail.app2Remark });
  if (detail.approver3) slots.push({ n: 3, approver: detail.approver3, designation: detail.designation3, date: detail.app3Date, remark: detail.app3Remark });
  return slots;
}


/*
  Function Name: dotStateFor
  LAYMAN    : Para sa isang step-dot sa progress bar, anong kulay/estado ito?
              Done (nag-approve na), active (naghihintay), declined (tinanggihan
              dito), o walang laman (hindi pa naaabot).
  TECHNICAL : Maps slotNumber + detail.status + detail.step to a CSS state string.
  PARAMS    : slotNumber — 1/2/3; detail — DTO.
  RETURNS   : 'done' | 'active' | 'declined' | '' (inactive).
*/
// Computes the visual state of a single step-dot.
// Returns one of: 'done' | 'active' | 'declined' | '' (inactive).
function dotStateFor(slotNumber, detail) {
  const status = detail.status;
  const step   = Number(detail.step) || 0;

  if (status === 'Fully Approved')        return 'done';
  if (status === 'Declined') {
    if (slotNumber <  step) return 'done';
    if (slotNumber === step) return 'declined';
    return '';
  }
  if (status === 'Returned to Requestor') {
    return (slotNumber === 1) ? 'active' : '';
  }
  // Pending Approver N
  if (slotNumber <  step) return 'done';
  if (slotNumber === step) return 'active';
  return '';
}


/*
  Function Name: renderProgressSteps
  LAYMAN    : Iguhit ang mga bilog sa taas ng page para makita kung gaano na
              ka-advanced ang approval (1→2→3 na may connecting lines).
  TECHNICAL : Renders .progress-steps with .step-dot divs and .step-line divs;
              state class from dotStateFor(). Empty slots array → ''.
*/
function renderProgressSteps(detail) {
  const slots = getConfiguredApproverSlots(detail);
  if (slots.length === 0) return '';

  let html = '<div class="progress-steps">';
  for (let i = 0; i < slots.length; i++) {
    const state = dotStateFor(slots[i].n, detail);
    const cls   = 'step-dot' + (state ? ' ' + state : '');
    const title = slots[i].approver + (slots[i].designation ? ' — ' + slots[i].designation : '');
    html += '<div class="' + cls + '" title="' + escapeHtml(title) + '">' + slots[i].n + '</div>';
    if (i < slots.length - 1) {
      const lineDone = (state === 'done') ? ' done' : '';
      html += '<div class="step-line' + lineDone + '"></div>';
    }
  }
  html += '</div>';
  return html;
}


// Renders one key/value pair as a .detail-row.
/*
  Function Name: renderDetailRow
  LAYMAN    : Isang row ng key-value pair sa request info card.
  TECHNICAL : Returns a .detail-row div with .detail-key and .detail-value.
*/
function renderDetailRow(key, value) {
  const v = (value === null || value === undefined || value === '')
    ? '<span class="text-muted">—</span>'
    : escapeHtml(value);
  return '' +
    '<div class="detail-row">' +
      '<div class="detail-key">'   + escapeHtml(key) + '</div>' +
      '<div class="detail-value">' + v               + '</div>' +
    '</div>';
}


// Renders the three "summary" cards (request info / product / contract).
/*
  Function Name: renderRequestSummaryCards
  LAYMAN    : Gumawa ng 4 info cards: Request Information, Product Details,
              Contract, at Purpose/Remark. Ginagamit sa requestor view AT
              approver review view.
  TECHNICAL : Returns 4 .card HTML blocks using renderDetailRow per field.
              Reused by ReviewDetail.html (shared global scope).
*/
function renderRequestSummaryCards(detail) {
  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Request information</div></div>' +
      renderDetailRow('Project title',         detail.projectTitle) +
      renderDetailRow('Requestor',             detail.requestor) +
      renderDetailRow('Requestor designation', detail.requestorDesig) +
      renderDetailRow('Group',                 detail.group) +
      renderDetailRow('Accountable person',    detail.accountablePerson) +
      renderDetailRow('Department',            detail.department) +
      renderDetailRow('Location',              detail.location) +
      renderDetailRow('PC name',               detail.pcName) +
      renderDetailRow('PRISM',                 detail.prism) +
      renderDetailRow('Purchase Order',        detail.purchaseOrder) +
      renderDetailRow('IHelp number',          detail.ihelpNumber) +
      renderDetailRow('Date of filing',        detail.dateFiled) +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Product details</div></div>' +
      renderDetailRow('Product type',          detail.productType) +
      renderDetailRow('Product name',          detail.productName) +
      renderDetailRow('Type of purchase',      detail.typeOfPurchase) +
      renderDetailRow('Type of license',       detail.typeOfLicense) +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Contract</div></div>' +
      renderDetailRow('Supplier',              detail.supplierName) +
      renderDetailRow('Contract start',        detail.contractStart) +
      renderDetailRow('Contract end',          detail.contractEnd) +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Purpose / remark</div></div>' +
      '<div>' + (detail.requestorRemark
        ? escapeHtml(detail.requestorRemark)
        : '<span class="text-muted">No remark provided.</span>') + '</div>' +
    '</div>';
}


// Renders the unified "Approvers" chain — every configured approver in the
// group with a status indicator. Replaces the old "Approval log" (which only
// listed approvers who had acted). Shared with ReviewDetail.html.
//
// State precedence per slot:
//   1. slot.date set                                  → Acted    ✓ navy
//   2. status "Declined" & step === n                 → Declined ✕ red
//   3. status "Returned to Requestor" & slot.remark   → Returned ↩ amber
//   4. step === n & status includes "Pending"         → Current  ⏳ amber
//   5. otherwise                                       → Awaiting ○ gray
//
// blurFutureEmails — when true (requestor view), an Awaiting approver's email
// is hidden (shown as "—") until it's their turn; designation always shows.
// Approvers (ReviewDetail) pass false and see the full chain.
/*
  Function Name: renderApproversChain
  LAYMAN    : I-render ang "Approvers" card sa right rail — sino ang approver,
              approved na ba, may remark ba, at kailan. Ang mga approver na hindi
              pa kailangan ay maaaring itago ang email (para sa requestor view).
  TECHNICAL : Maps configured slots to rows with status icons (✓/✕/↩/⏳/○);
              blurFutureEmails=true hides emails for awaiting slots (requestor view).
              blurFutureEmails=false shows all (approver view).
  PARAMS    : detail — DTO; blurFutureEmails — bool.
  RETURNS   : .card HTML string.
*/
function renderApproversChain(detail, blurFutureEmails) {
  const slots = getConfiguredApproverSlots(detail);
  if (slots.length === 0) return '';

  const status = detail.status || '';
  const step   = Number(detail.step) || 0;

  const rows = slots.map(function (s) {
    let icon, color, label, revealEmail = true;
    if (s.date) {
      icon = '✓'; color = 'var(--navy-900)';  label = escapeHtml(s.date);
    } else if (status === 'Declined' && step === s.n) {
      icon = '✕'; color = 'var(--red-text)';   label = 'Declined';
    } else if (status === 'Returned to Requestor' && s.remark) {
      icon = '↩'; color = 'var(--amber-text)'; label = 'Returned for revision';
    } else if (step === s.n && status.indexOf('Pending') !== -1) {
      icon = '⏳'; color = 'var(--amber-text)'; label = 'Pending review';
    } else {
      icon = '○'; color = 'var(--gray-400)';   label = 'Awaiting';
      if (blurFutureEmails) revealEmail = false;
    }

    const remarkBlock = s.remark
      ? '<div class="text-small text-muted mt-sm">Remark: ' + escapeHtml(s.remark) + '</div>'
      : '';

    const emailCell = revealEmail
      ? escapeHtml(s.approver)
      : '<span class="text-muted">—</span>';

    return '' +
      '<div class="detail-row">' +
        '<div class="detail-key">' +
          '<span style="color: ' + color + '; margin-right: 6px; font-weight: 600;">' + icon + '</span>' +
          'Approver ' + s.n +
        '</div>' +
        '<div class="detail-value">' +
          emailCell +
          (s.designation ? '<div class="text-tiny text-muted">' + escapeHtml(s.designation) + '</div>' : '') +
          '<div class="text-small mt-sm">' + label + '</div>' +
          remarkBlock +
        '</div>' +
      '</div>';
  }).join('');

  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Approvers</div></div>' +
      rows +
    '</div>';
}


// Renders the resubmit banner. Shared with ReviewDetail.html. Split into:
//   Block A — the CURRENT active return ([PENDING] entry): amber alert, always
//             expanded, no toggle. This is what the requestor must act on now.
//   Block B — PREVIOUS confirmed resubmit cycles (Resubmit #N entries): lighter
//             styling, collapsible.
// Parses detail.resubmitHistory rather than relying on resubmitCount, so the
// banner also shows on the first return (count still 0, but a [PENDING] exists).
/*
  Function Name: renderResubmitBanner
  LAYMAN    : Kapag may pagbabalik, ipakita ang amber alert na nagsasabi kung
              BAKIT ibinalik at (kung marami nang resubmit), may collapsible
              history ng mga nakaraang returns.
  TECHNICAL : Parses detail.resubmitHistory (separator: "\n\n---\n\n"). Block A
              = the [PENDING] entry (current return, always shown). Block B =
              numbered entries (collapsible toggle). Empty history → ''.
*/
function renderResubmitBanner(detail) {
  const history = String(detail.resubmitHistory || '').trim();
  if (!history) return '';

  const entries = history.split('\n\n---\n\n')
    .map(function (e) { return e.trim(); })
    .filter(Boolean);

  const pending   = entries.filter(function (e) { return e.indexOf('[PENDING]') === 0; });
  const confirmed = entries.filter(function (e) { return e.indexOf('Resubmit #') === 0; });

  if (!pending.length && !confirmed.length) return '';

  // ── Block A — current active return ──
  let blockA = '';
  if (pending.length) {
    const lines = pending[pending.length - 1]   // most recent pending entry
      .replace(/^\[PENDING\]\s*/, '')           // drop the internal marker
      .split('\n');
    // line 0: "Approver 1 (email)" → "Returned by: Approver 1 — email"
    lines[0] = 'Returned by: ' + lines[0].replace(/\(([^)]+)\)/, '— $1');
    const body = lines.map(escapeHtml).join('<br>');
    blockA = '' +
      '<div class="resubmit-banner">' +
        '<div class="mb-sm"><strong>⚠ This request has been returned for revision.</strong></div>' +
        '<div class="text-small">' + body + '</div>' +
      '</div>';
  }

  // ── Block B — previous confirmed resubmit history ──
  let blockB = '';
  if (confirmed.length) {
    const n = confirmed.length;
    const divider = '<div style="border-top: 1px solid var(--gray-200); margin: 8px 0;"></div>';
    const body = confirmed.map(function (e) {
      return '<div style="white-space: pre-wrap;">' + escapeHtml(e) + '</div>';
    }).join(divider);
    blockB = '' +
      '<div class="mt-sm">' +
        '<a href="javascript:void(0)" onclick="toggleResubmitHistory()" ' +
           'style="color: var(--gray-600); cursor: pointer; font-size: 12px;">' +
          'Previous return history (' + n + ' cycle' + (n === 1 ? '' : 's') + ') ' +
          '<span id="resubmit-arrow">▾</span>' +
        '</a>' +
        '<div id="resubmit-history" class="hidden text-small mt-sm" ' +
             'style="border-left: 2px solid var(--gray-200); padding-left: 12px;">' +
          body +
        '</div>' +
      '</div>';
  }

  return blockA + blockB;
}


// Toggles the previous-return-history block (Block B) under the banner.
/*
  Function Name: toggleResubmitHistory
  LAYMAN    : Expand/collapse ang old resubmit history sa banner.
  TECHNICAL : Toggles .hidden on #resubmit-history-block; rotates arrow indicator.
*/
function toggleResubmitHistory() {
  const block = document.getElementById('resubmit-history');
  const arrow = document.getElementById('resubmit-arrow');
  if (!block) return;
  const nowHidden = block.classList.toggle('hidden');
  if (arrow) arrow.textContent = nowHidden ? '▾' : '▴';
}


// Renders the attachments card.
// canManage = true → show the (disabled) upload placeholder.
/*
  Function Name: renderAttachmentsBlock
  LAYMAN    : Ipakita ang listahan ng mga attachments ng request. Kung
              requestor at may pahintulot na mag-manage, lalabas ang upload
              placeholder (Phase 8 feature). Para sa approver view, read-only.
  TECHNICAL : Renders .card; if canManage=true renders a disabled upload placeholder.
              blurFutureEmails logic is in renderApproversChain, not here.
  PARAMS    : detail — DTO; canManage — bool (requestor=true for upload controls).
*/
function renderAttachmentsBlock(detail, canManage) {
  const attachments = detail.attachments || [];
  const expected    = Number(detail.expectedAttachments) || 0;

  let body;
  if (attachments.length === 0) {
    body = '<div class="text-muted">No attachments uploaded.</div>';
  } else {
    body = attachments.map(function (a) {
      const label = a.description || a.fileLink || 'Attachment';
      return '<div class="mb-sm">' +
        '<a href="' + escapeHtml(a.fileLink) + '" target="_blank" rel="noopener">' +
          escapeHtml(label) +
        '</a>' +
      '</div>';
    }).join('');
  }

  let placeholder = '';
  if (canManage) {
    const missing = Math.max(0, expected - attachments.length);
    const note = (detail.status === 'Syncing Files' && missing > 0)
      ? 'Waiting on ' + missing + ' more file' + (missing === 1 ? '' : 's') + '. '
      : '';
    placeholder =
      '<div class="mt-md">' +
        '<button class="btn btn-secondary" disabled>Upload files</button> ' +
        '<span class="text-tiny text-muted">' +
          escapeHtml(note) + 'Upload UI ships in a later phase.' +
        '</span>' +
      '</div>';
  }

  return '' +
    '<div class="card">' +
      '<div class="card-header">' +
        '<div class="card-title">Attachments</div>' +
        '<div class="text-tiny text-muted">' +
          attachments.length + ' uploaded' +
          (expected ? ' / ' + expected + ' expected' : '') +
        '</div>' +
      '</div>' +
      body + placeholder +
    '</div>';
}


// ─── PAGE RENDERER ─────────────────────────────────────────
/*
  Function Name: renderRequestDetailPage
  LAYMAN    : Ipakita ang buong detalye ng isang request sa requestor.
              Kung "Returned" ang status, lalabas ang Resubmit button sa kanang
              rail. Kung hindi siya ang may-ari → null lang ibabalik ng server
              at lalabas ang "not found" empty state.
  TECHNICAL : callServer('getRequestDetail',id); null → empty state. Two-column
              detail-layout: summary cards + attachments left; approvers chain +
              resubmit button right rail.
  PARAMS    : params — { id: requestId }.
  RETURNS   : HTML string.
*/
async function renderRequestDetailPage(params) {
  const id = params && params.id;
  if (!id) {
    return renderEmptyState({
      title:   'Missing request ID',
      message: 'No request was selected.',
      emotion: 'default',
    });
  }

  const detail = await callServer('getRequestDetail', id);
  if (!detail) {
    return renderEmptyState({
      title:   'Request not found',
      message: 'We could not find request ' + escapeHtml(id) + '.',
      emotion: 'declined',
    });
  }

  const isOwner       = state.user && detail.requestor && state.user.email === detail.requestor;
  const canResubmit   = isOwner && detail.status === 'Returned to Requestor';

  const resubmitBar = canResubmit
    ? '<div class="form-actions">' +
        '<button class="btn btn-primary" onclick="onResubmitClick(\'' + escapeHtml(id) + '\')">Resubmit request</button>' +
      '</div>'
    : '';

  return `
    <div class="page-header">
      <div>
        <div class="text-tiny text-muted">${escapeHtml(detail.controlNumber)}</div>
        <div class="page-title">${escapeHtml(detail.projectTitle)}</div>
        <div class="page-subtitle">${renderStatusBadge(detail.status)}</div>
      </div>
      <button class="btn btn-secondary" onclick="navigateTo('home')">← Back</button>
    </div>

    ${renderProgressSteps(detail)}
    ${renderResubmitBanner(detail)}

    <div class="detail-layout">

      <div class="detail-main">
        ${renderRequestSummaryCards(detail)}
        ${renderAttachmentsBlock(detail, isOwner)}
      </div>

      <div class="detail-rail">
        ${renderApproversChain(detail, true)}
        ${resubmitBar}
      </div>

    </div>
  `;
}


// ─── ACTIONS ───────────────────────────────────────────────
/*
  Function Name: onResubmitClick
  LAYMAN    : Pag pinindot ng requestor ang "Resubmit request": tanungin muna
              ("Sure ka ba?"), tapos ipakita ang loading overlay, tapos itawag
              ang server, tapos i-refresh ang page para makita ang bagong status.
  TECHNICAL : showConfirm → showLoading → callServer('handleResubmit') →
              on success hideLoading + navigateTo 'request' (same page);
              on failure hideLoading + showToast.
  PARAMS    : requestId — the request to resubmit.
*/
async function onResubmitClick(requestId) {
  const ok = await showConfirm({
    title:        'Resubmit request',
    message:      'This request will be routed back to Approver 1 from the start of the approval chain. Continue?',
    confirmLabel: 'Resubmit',
  });
  if (!ok) return;

  showLoading('Resubmitting…');
  try {
    const result = await callServer('handleResubmit', requestId);
    if (result && result.success) {
      hideLoading();
      showToast('Request resubmitted.', 'success');
      navigateTo('request', { id: requestId });
    } else {
      hideLoading();
      showToast((result && result.message) || 'Failed to resubmit.', 'error');
    }
  } catch (err) {
    hideLoading();
    showToast((err && err.message) || 'Server error.', 'error');
  }
}
</script>
