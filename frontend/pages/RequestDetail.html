<!-- RequestDetail.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: RequestDetail.html  (page — requestor read-only view)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang "view your request" page ng requestor. Lahat ng field, approvers,
  attachments, at resubmit history ay makikita dito. Kung "Returned to
  Requestor" ang status, lalabas ang resubmit panel — pwedeng magdagdag ng
  bago/tamang documents bago i-resubmit. Files ay binubuksan via "View" na
  dumadaan sa server (gated) — walang Drive link. Read-only ang iba pa.

  IMPORTANT — SHARED HELPERS:
  Maraming helpers na naka-define dito ay ginagamit DIN ng ReviewDetail.html.
  Apps Script shares one global scope, kaya accessible sila kahit ibang file.
  Huwag i-rename o ilipat nang hindi inuupdate ang ReviewDetail. Ang resubmit
  panel ay GINAGAMIT DIN ang new-request file picker (window._newRequestFiles,
  onAttachmentFilesSelected, renderAttachmentList, readFileAsBase64 — naka-define
  sa NewRequest.html) sa parehong DOM ids; ligtas dahil iisang page lang ang
  nakikita kada oras.

  TECHNICAL:
  Two-column layout (detail-layout): summary cards + attachments + resubmit
  panel on the left, approvers chain on the right rail.

  SHARED HELPERS (consumed by ReviewDetail.html too):
    - getConfiguredApproverSlots(detail)   non-empty approver slots array
    - dotStateFor(slotNumber, detail)      'done'|'active'|'declined'|''
    - renderProgressSteps(detail)          step dots + connecting lines
    - renderDetailRow(key, value)          single labeled row in .detail-row
    - renderRequestSummaryCards(detail)    4 info cards (Request/Product/Contract/Purpose)
    - renderApproversChain(detail, blur)   approver chain with icons + conditional email blur
    - renderResubmitBanner(detail)         current return entry + collapsible history
    - renderAttachmentsBlock(detail, canManage)  attachments card (filename + View + desc)
    - viewAttachmentFile(attachmentId)     gated fetch → inline preview / download
    - toggleAttachDesc(attachmentId)       show/hide an attachment's description

  PAGE FUNCTIONS:
    - renderRequestDetailPage(params)     main renderer; getRequestDetail + auth
    - afterRender_request(params)         wires the resubmit file picker (if present)
    - onResubmitClick(requestId)          resubmit handler: optional re-upload + confirm
    - toggleResubmitHistory()             expands/collapses old resubmit history
-->


<script>
// ─── SHARED HELPERS (also used by ReviewDetail) ────────────

/*
  Function Name: getConfiguredApproverSlots
  LAYMAN    : Kuhanin ang listahan ng mga approver ng request (1, 2, o 3),
              laktawan ang blangkong slots.
  TECHNICAL : Maps up to 3 approver slots from detail; omits slots where
              approver is blank. Returns [{n, approver, designation, date, remark}].
  PARAMS    : detail — the getRequestDetail DTO.
  RETURNS   : Array of configured slot objects (length 1–3).
*/
// Returns the configured approver slots for a request.
// Slots without a configured approver are omitted.
function getConfiguredApproverSlots(detail) {
  const slots = [];
  if (detail.approver1) slots.push({ n: 1, approver: detail.approver1, designation: detail.designation1, date: detail.app1Date, remark: detail.app1Remark });
  if (detail.approver2) slots.push({ n: 2, approver: detail.approver2, designation: detail.designation2, date: detail.app2Date, remark: detail.app2Remark });
  if (detail.approver3) slots.push({ n: 3, approver: detail.approver3, designation: detail.designation3, date: detail.app3Date, remark: detail.app3Remark });
  return slots;
}


/*
  Function Name: dotStateFor
  LAYMAN    : Para sa isang step-dot sa progress bar, anong kulay/estado ito?
              Done (nag-approve na), active (naghihintay), declined (tinanggihan
              dito), o walang laman (hindi pa naaabot).
  TECHNICAL : Maps slotNumber + detail.status + detail.step to a CSS state string.
  PARAMS    : slotNumber — 1/2/3; detail — DTO.
  RETURNS   : 'done' | 'active' | 'declined' | '' (inactive).
*/
// Computes the visual state of a single step-dot.
// Returns one of: 'done' | 'active' | 'declined' | '' (inactive).
function dotStateFor(slotNumber, detail) {
  const status = detail.status;
  const step   = Number(detail.step) || 0;

  if (status === 'Fully Approved')        return 'done';
  if (status === 'Declined') {
    if (slotNumber <  step) return 'done';
    if (slotNumber === step) return 'declined';
    return '';
  }
  if (status === 'Returned to Requestor') {
    return (slotNumber === 1) ? 'active' : '';
  }
  // Pending Approver N
  if (slotNumber <  step) return 'done';
  if (slotNumber === step) return 'active';
  return '';
}


/*
  Function Name: renderProgressSteps
  LAYMAN    : Iguhit ang mga bilog sa taas ng page para makita kung gaano na
              ka-advanced ang approval (1→2→3 na may connecting lines).
  TECHNICAL : Renders .progress-steps with .step-dot divs and .step-line divs;
              state class from dotStateFor(). Empty slots array → ''.
*/
function renderProgressSteps(detail) {
  const slots = getConfiguredApproverSlots(detail);
  if (slots.length === 0) return '';

  let html = '<div class="progress-steps">';
  for (let i = 0; i < slots.length; i++) {
    const state = dotStateFor(slots[i].n, detail);
    const cls   = 'step-dot' + (state ? ' ' + state : '');
    const title = slots[i].approver + (slots[i].designation ? ' — ' + slots[i].designation : '');
    html += '<div class="' + cls + '" title="' + escapeHtml(title) + '">' + slots[i].n + '</div>';
    if (i < slots.length - 1) {
      const lineDone = (state === 'done') ? ' done' : '';
      html += '<div class="step-line' + lineDone + '"></div>';
    }
  }
  html += '</div>';
  return html;
}


// Renders one key/value pair as a .detail-row.
/*
  Function Name: renderDetailRow
  LAYMAN    : Isang row ng key-value pair sa request info card. Pwedeng
              i-full-width ang row sa loob ng two-column grid (para sa
              mahahabang values tulad ng project title).
  TECHNICAL : Returns a .detail-row div with .detail-key and .detail-value.
              full=true adds .detail-row--full (spans both .detail-grid columns).
  PARAMS    : key — label; value — display value (— when empty);
              full — optional bool, span both grid columns.
*/
function renderDetailRow(key, value, full, flag) {
  const v = (value === null || value === undefined || value === '')
    ? '<span class="text-muted">—</span>'
    : escapeHtml(value);
  // flag (optional, additive): an OPEN return flag on this field → amber
  // highlight + the approver's comment pinned under the value.
  const flagPin = flag
    ? '<div class="flag-pin">' + renderIcon('flag', 12) + ' ' + escapeHtml(flag.comment) + '</div>'
    : '';
  return '' +
    '<div class="detail-row' + (full ? ' detail-row--full' : '') + (flag ? ' detail-row--flagged' : '') + '">' +
      '<div class="detail-key">'   + escapeHtml(key) + '</div>' +
      '<div class="detail-value">' + v + flagPin     + '</div>' +
    '</div>';
}

/*
  Function Name: openFieldFlags
  LAYMAN    : Mula sa detail DTO, kunin ang mga BUKAS pang field flag bilang
              { fieldKey: flag } — para madaling itanong ng bawat row kung
              minarkahan ba siya.
  TECHNICAL : Filters detail.flags to open (resolved=false) field-type flags.
              Attachment flags are surfaced by renderFlagsCard, not per-row.
*/
function openFieldFlags(detail) {
  const map = {};
  (detail.flags || []).forEach(function (f) {
    if (!f.resolved && f.targetType === 'field') map[f.targetKey] = f;
  });
  return map;
}


// Renders the three "summary" cards (request info / product / contract).
/*
  Function Name: renderRequestSummaryCards
  LAYMAN    : Gumawa ng 4 info cards: Request Information, Product Details,
              Contract, at Purpose/Remark. Ginagamit sa requestor view AT
              approver review view.
  TECHNICAL : Returns 4 .card HTML blocks using renderDetailRow per field.
              Field rows sit inside a .detail-grid (2-col on desktop ≥1024px,
              stacked label-over-value cells). Long values span both columns
              via renderDetailRow(..., true). Reused by ReviewDetail.html
              (shared global scope).
*/
function renderRequestSummaryCards(detail) {
  // Open field flags (returned-for-revision marks) highlight their rows on
  // BOTH the requestor and approver views — everyone sees the same marks.
  const fl = openFieldFlags(detail);
  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Request information</div></div>' +
      '<div class="detail-grid">' +
        renderDetailRow('Project title',         detail.projectTitle, true, fl.projectTitle) +
        renderDetailRow('Requestor',             detail.requestor) +
        renderDetailRow('Requestor designation', detail.requestorDesig, false, fl.requestorDesig) +
        renderDetailRow('Group',                 detail.group) +
        renderDetailRow('Accountable person',    detail.accountablePerson, false, fl.accountablePerson) +
        renderDetailRow('Department',            detail.department, false, fl.department) +
        renderDetailRow('Location',              detail.location, false, fl.location) +
        renderDetailRow('PC name',               detail.pcName, false, fl.pcName) +
        renderDetailRow('PRISM',                 detail.prism, false, fl.prism) +
        renderDetailRow('Purchase Order',        detail.purchaseOrder, false, fl.purchaseOrder) +
        renderDetailRow('IHelp number',          detail.ihelpNumber, false, fl.ihelpNumber) +
        renderDetailRow('Date of filing',        detail.dateFiled) +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Product details</div></div>' +
      '<div class="detail-grid">' +
        renderDetailRow('Product type',          detail.productType, false, fl.productType) +
        renderDetailRow('Product name',          detail.productName, false, fl.productName) +
        renderDetailRow('Type of purchase',      detail.typeOfPurchase, false, fl.typeOfPurchase) +
        renderDetailRow('Type of license',       detail.typeOfLicense, false, fl.typeOfLicense) +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Contract</div></div>' +
      '<div class="detail-grid">' +
        renderDetailRow('Supplier',              detail.supplierName, false, fl.supplierName) +
        renderDetailRow('Contract start',        detail.contractStart, false, fl.contractStart) +
        renderDetailRow('Contract end',          detail.contractEnd, false, fl.contractEnd) +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Purpose / remark</div></div>' +
      '<div>' + (detail.requestorRemark
        ? escapeHtml(detail.requestorRemark)
        : '<span class="text-muted">No remark provided.</span>') +
        (fl.requestorRemark
          ? '<div class="flag-pin">' + renderIcon('flag', 12) + ' ' + escapeHtml(fl.requestorRemark.comment) + '</div>'
          : '') +
      '</div>' +
    '</div>';
}

/*
  Function Name: renderFlagsCard

  LAYMAN (Tropang Ex):
  Ang "What needs fixing" card. Kapag may mga BUKAS na marka (kaka-return lang),
  nakalista dito lahat: aling field o dokumento, ano ang komento ng approver,
  sino at kailan nag-marka. Kapag KAKA-RESUBMIT lang naman (wala nang bukas na
  marka), ipinapakita ang mga markang inayos ng huling resubmit bilang "marked
  as fixed" — para sa approver na nagre-review, listahan ito ng dapat niyang
  i-double-check. Wala pareho? Walang card.

  TECHNICAL:
  Same function on BOTH detail pages (global scope, like renderResubmitBanner).
  Open flags take precedence; else flags with cycle === resubmitCount - 1
  (addressed by the current cycle's resubmit) render in the resolved style.
  Attachment flags are included with a "(document)" tag. Everything escaped.

  PARAMS    : detail — the getRequestDetail DTO.
  RETURNS   : .card HTML string or ''.
*/
function renderFlagsCard(detail) {
  const flags = detail.flags || [];
  if (!flags.length) return '';

  const open = flags.filter(function (f) { return !f.resolved; });
  const currentCycle = Number(detail.resubmitCount) || 0;
  const justFixed = flags.filter(function (f) { return f.resolved && f.cycle === currentCycle - 1; });

  let title, items, resolvedStyle;
  if (open.length) {
    title = 'What needs fixing';
    items = open;
    resolvedStyle = false;
  } else if (justFixed.length && String(detail.status || '').indexOf('Pending') !== -1) {
    title = 'Flagged last cycle — marked as fixed';
    items = justFixed;
    resolvedStyle = true;
  } else {
    return '';
  }

  const rows = items.map(function (f) {
    const tag = f.targetType === 'attachment' ? ' (document)' : '';
    return '' +
      '<div class="flags-card-item' + (resolvedStyle ? ' flags-card-resolved' : '') + '">' +
        '<div class="flags-card-label">' +
          '<span class="flag-icon">' + renderIcon(resolvedStyle ? 'check' : 'flag', 13) + '</span>' +
          escapeHtml(f.label + tag) +
        '</div>' +
        '<div class="flags-card-comment">' + escapeHtml(f.comment) + '</div>' +
        '<div class="flags-card-meta">Flagged by ' + escapeHtml(f.flaggedBy) +
          (f.flaggedAt ? ' · ' + escapeHtml(f.flaggedAt) : '') + '</div>' +
      '</div>';
  }).join('');

  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">' + title + '</div></div>' +
      rows +
    '</div>';
}


// Renders the unified "Approvers" chain — every configured approver in the
// group with a status indicator. Replaces the old "Approval log" (which only
// listed approvers who had acted). Shared with ReviewDetail.html.
//
// State precedence per slot (icon = Lucide via renderIcon, colored by wrapper):
//   1. slot.date set                                  → Acted    check  navy
//   2. status "Declined" & step === n                 → Declined x      red
//   3. status "Returned to Requestor" & slot.remark   → Returned return amber
//   4. step === n & status includes "Pending"         → Current  clock  amber
//   5. otherwise                                       → Awaiting circle gray
//
// blurFutureEmails — when true (requestor view), an Awaiting approver's email
// is hidden (shown as "—") until it's their turn; designation always shows.
// Approvers (ReviewDetail) pass false and see the full chain.
/*
  Function Name: renderApproversChain
  LAYMAN    : I-render ang "Approvers" card sa right rail — sino ang approver,
              approved na ba, may remark ba, at kailan. Ang mga approver na hindi
              pa kailangan ay maaaring itago ang email (para sa requestor view).
  TECHNICAL : Maps configured slots to rows with status icons (check/x/return/clock/circle);
              blurFutureEmails=true hides emails for awaiting slots (requestor view).
              blurFutureEmails=false shows all (approver view).
  PARAMS    : detail — DTO; blurFutureEmails — bool.
  RETURNS   : .card HTML string.
*/
function renderApproversChain(detail, blurFutureEmails) {
  const slots = getConfiguredApproverSlots(detail);
  if (slots.length === 0) {
    // A silent empty rail reads as a rendering bug; name the real condition.
    // (Reachable when a group's chain was emptied/deactivated after filing.)
    return '' +
      '<div class="card">' +
        '<div class="card-header"><div class="card-title">Approvers</div></div>' +
        '<div class="text-small text-muted">No approver chain is configured for this request\'s group. ' +
        'Please contact your administrator.</div>' +
      '</div>';
  }

  const status = detail.status || '';
  const step   = Number(detail.step) || 0;

  const rows = slots.map(function (s) {
    let icon, color, label, revealEmail = true;
    if (s.date) {
      icon = renderIcon('check', 14);  color = 'var(--navy-900)';  label = escapeHtml(s.date);
    } else if (status === 'Declined' && step === s.n) {
      icon = renderIcon('x', 14);      color = 'var(--red-text)';   label = 'Declined';
    } else if (status === 'Returned to Requestor' && s.remark) {
      icon = renderIcon('return', 14); color = 'var(--amber-text)'; label = 'Returned for revision';
    } else if (status.indexOf('Pending') !== -1 && step === s.n) {
      icon = renderIcon('clock', 14);  color = 'var(--amber-text)'; label = 'Pending review';
    } else if (status.indexOf('Pending') !== -1) {
      // Request is still active and this is a later step → genuinely awaiting.
      icon = renderIcon('circle', 14); color = 'var(--gray-400)';   label = 'Awaiting';
      if (blurFutureEmails) revealEmail = false;
    } else {
      // Terminal (Declined / Returned / etc.) and this slot never acted → it was
      // never reached. Don't show "Awaiting" — nothing is waiting on them.
      icon = renderIcon('circle', 14); color = 'var(--gray-400)';   label = '—';
      if (blurFutureEmails) revealEmail = false;
    }

    const remarkBlock = s.remark
      ? '<div class="text-small text-muted mt-sm">Remark: ' + escapeHtml(s.remark) + '</div>'
      : '';

    const emailCell = revealEmail
      ? escapeHtml(s.approver)
      : '<span class="text-muted">—</span>';

    return '' +
      '<div class="detail-row">' +
        '<div class="detail-key">' +
          '<span style="color: ' + color + '; margin-right: 6px; font-weight: 600;">' + icon + '</span>' +
          'Approver ' + s.n +
        '</div>' +
        '<div class="detail-value">' +
          emailCell +
          (s.designation ? '<div class="text-tiny text-muted">' + escapeHtml(s.designation) + '</div>' : '') +
          '<div class="text-small mt-sm">' + label + '</div>' +
          remarkBlock +
        '</div>' +
      '</div>';
  }).join('');

  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Approvers</div></div>' +
      rows +
    '</div>';
}


// Renders the resubmit banner. Shared with ReviewDetail.html. Split into:
//   Block A — the CURRENT active return ([PENDING] entry): amber alert, always
//             expanded, no toggle. This is what the requestor must act on now.
//   Block B — PREVIOUS confirmed resubmit cycles (Resubmit #N entries): lighter
//             styling, collapsible.
// Parses detail.resubmitHistory rather than relying on resubmitCount, so the
// banner also shows on the first return (count still 0, but a [PENDING] exists).
/*
  Function Name: renderResubmitBanner
  LAYMAN    : Kapag may pagbabalik, ipakita ang amber alert na nagsasabi kung
              BAKIT ibinalik at (kung marami nang resubmit), may collapsible
              history ng mga nakaraang returns.
  TECHNICAL : Parses detail.resubmitHistory (separator: "\n\n---\n\n"). Block A
              = the [PENDING] entry (current return, always shown). Block B =
              numbered entries (collapsible toggle). Empty history → ''.
*/
function renderResubmitBanner(detail) {
  const history = String(detail.resubmitHistory || '').trim();
  if (!history) return '';

  const entries = history.split('\n\n---\n\n')
    .map(function (e) { return e.trim(); })
    .filter(Boolean);

  const pending   = entries.filter(function (e) { return e.indexOf('[PENDING]') === 0; });
  const confirmed = entries.filter(function (e) { return e.indexOf('Resubmit #') === 0; });

  if (!pending.length && !confirmed.length) return '';

  // ── Block A — current active return ──
  let blockA = '';
  if (pending.length) {
    const lines = pending[pending.length - 1]   // most recent pending entry
      .replace(/^\[PENDING\]\s*/, '')           // drop the internal marker
      .split('\n');
    // line 0: "Approver 1 (email)" → "Returned by: Approver 1 — email"
    lines[0] = 'Returned by: ' + lines[0].replace(/\(([^)]+)\)/, '— $1');
    const body = lines.map(escapeHtml).join('<br>');
    blockA = '' +
      '<div class="resubmit-banner">' +
        '<div class="mb-sm"><strong>' + renderIcon('alert', 14) + ' This request has been returned for revision.</strong></div>' +
        '<div class="text-small">' + body + '</div>' +
      '</div>';
  }

  // ── Block B — previous confirmed resubmit history ──
  let blockB = '';
  if (confirmed.length) {
    const n = confirmed.length;
    const divider = '<div style="border-top: 1px solid var(--gray-200); margin: 8px 0;"></div>';
    const body = confirmed.map(function (e) {
      return '<div style="white-space: pre-wrap;">' + escapeHtml(e) + '</div>';
    }).join(divider);
    blockB = '' +
      '<div class="mt-sm">' +
        '<a href="javascript:void(0)" onclick="toggleResubmitHistory()" ' +
           'style="color: var(--gray-600); cursor: pointer; font-size: 12px;">' +
          'Previous return history (' + n + ' cycle' + (n === 1 ? '' : 's') + ') ' +
          '<span id="resubmit-arrow">' + renderIcon('chevron-down', 14) + '</span>' +
        '</a>' +
        '<div id="resubmit-history" class="hidden text-small mt-sm" ' +
             'style="border-left: 2px solid var(--gray-200); padding-left: 12px;">' +
          body +
        '</div>' +
      '</div>';
  }

  return blockA + blockB;
}


// Toggles the previous-return-history block (Block B) under the banner.
/*
  Function Name: toggleResubmitHistory
  LAYMAN    : Expand/collapse ang old resubmit history sa banner.
  TECHNICAL : Toggles .hidden on #resubmit-history-block; swaps the chevron icon.
*/
function toggleResubmitHistory() {
  const block = document.getElementById('resubmit-history');
  const arrow = document.getElementById('resubmit-arrow');
  if (!block) return;
  const nowHidden = block.classList.toggle('hidden');
  if (arrow) arrow.innerHTML = nowHidden ? renderIcon('chevron-down', 14) : renderIcon('chevron-up', 14);
}


// Renders the attachments card. Files are private (Phase 8 gated serving):
// each row shows the filename + description inline (always visible) + a "View"
// button served through the identity-gated downloadAttachment. No Drive link.
// Resubmitted requests group files by cycle (#6): "Current submission" vs
// "Previous versions". Shared with ReviewDetail.html.
/*
  Function Name: renderAttachmentsBlock
  LAYMAN    : Ipakita ang listahan ng mga supporting documents. Bawat file ay
              may filename (bold) at description (muted, laging nakikita — hindi
              kailangan pang mag-click para makita), at isang "View" button na
              bubuksan ang file nang dumadaan sa server na may identity-check.
              Kung naka-resubmit na ang request, hinahati ang files: "Current
              submission" (yung pinakabagong cycle) vs "Previous versions" (mga
              luma, naka-label per cycle: Original / Resubmit #N). Kaya kita mo
              agad kung alin ang dati at alin ang bago habang nagre-review o
              nagre-resubmit. Description is shown by default: it's the primary
              decision-relevant info for approvers.
  TECHNICAL : Renders .card. A file's cycle = a.resubmitCycle (0 = original,
              N = Resubmit #N); the request's current cycle = detail.resubmitCount.
              When currentCycle === 0 (never resubmitted) it renders the flat list
              exactly as before — no group headers in the common case. When
              resubmitted: a "Current submission" group (cycle === currentCycle,
              may be empty if the latest resubmit added no files) + a "Previous
              versions" group (cycle < currentCycle, sub-grouped by cycle, newest
              first). Each row: attachment-view-name + attachment-view-desc +
              View button (viewAttachmentFile → gated server fetch). Only
              attachmentId goes to onclick (safe chars; no injection risk).
              No fileLink in the DTO — the URL never leaves the server.
  PARAMS    : detail — DTO from getRequestDetail(); canManage — bool (retained
              for signature compatibility; UI is identical for both roles).
*/
function renderAttachmentsBlock(detail, canManage) {
  const attachments  = detail.attachments || [];
  const currentCycle = parseInt(detail.resubmitCount, 10) || 0;

  // One file row — shared by the flat list and every grouped section.
  function attachmentRow(a) {
    const name = a.filename    || 'Attachment';
    const desc = a.description || '';
    const aid  = escapeHtml(a.attachmentId);
    return '' +
      '<div class="attachment-view-row">' +
        '<div class="attachment-view-info">' +
          '<span class="attachment-view-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
          (desc ? '<span class="attachment-view-desc">' + escapeHtml(desc) + '</span>' : '') +
        '</div>' +
        '<button type="button" class="attachment-link-btn" onclick="viewAttachmentFile(\'' + aid + '\')">View</button>' +
      '</div>';
  }
  function cycleOf(a) { return parseInt(a.resubmitCycle, 10) || 0; }

  let body;
  if (attachments.length === 0) {
    body = '<div class="text-muted">No attachments on this request.</div>';
  } else if (currentCycle === 0) {
    // Never resubmitted → single flat list (unchanged common-case UX).
    body = attachments.map(attachmentRow).join('');
  } else {
    // Resubmitted → "Current submission" vs "Previous versions".
    const current  = attachments.filter(function (a) { return cycleOf(a) === currentCycle; });
    const previous = attachments.filter(function (a) { return cycleOf(a) <   currentCycle; });
    const sections = [];

    // Current submission (the latest cycle). May legitimately be empty: a
    // resubmit is allowed with zero new files (the prior docs carry over).
    sections.push(
      '<div class="attachment-group">' +
        '<div class="attachment-group-label">Current submission · Resubmit #' + currentCycle + '</div>' +
        (current.length
          ? current.map(attachmentRow).join('')
          : '<div class="text-muted attachment-group-empty">No new documents added this submission.</div>') +
      '</div>'
    );

    // Previous versions — sub-grouped by cycle, newest first.
    if (previous.length) {
      const byCycle = {};
      previous.forEach(function (a) {
        const c = cycleOf(a);
        (byCycle[c] = byCycle[c] || []).push(a);
      });
      const cycles = Object.keys(byCycle)
        .map(Number)
        .sort(function (x, y) { return y - x; });
      let prevRows = '';
      cycles.forEach(function (c) {
        const label = (c === 0) ? 'Original submission' : ('Resubmit #' + c);
        prevRows += '<div class="attachment-subgroup-label">' + label + '</div>' +
                    byCycle[c].map(attachmentRow).join('');
      });
      sections.push(
        '<div class="attachment-group attachment-group-previous">' +
          '<div class="attachment-group-label">Previous versions</div>' +
          prevRows +
        '</div>'
      );
    }

    body = sections.join('');
  }

  return '' +
    '<div class="card">' +
      '<div class="card-header">' +
        '<div class="card-title">Attachments</div>' +
        '<div class="text-tiny text-muted">' + attachments.length + ' file' +
          (attachments.length !== 1 ? 's' : '') +
        '</div>' +
      '</div>' +
      body +
    '</div>';
}


// In-memory blob URL cache — keyed by attachmentId.
// Second+ views of the same file are instant (no server round-trip).
// Cleared on page navigation (window._attachmentBlobCache resets per render).
window._attachmentBlobCache = window._attachmentBlobCache || {};

/*
  Function Name: viewAttachmentFile
  LAYMAN    : Bubuksan ang isang attachment. Kinukuha ang file mula sa server
              (na nagche-check muna kung ikaw ay requestor o approver), tapos
              ipinapakita: PDF/larawan → bagong tab inline; ibang type →
              idini-download. Ang ika-2+ view ng parehong file ay instant —
              naka-cache na ang blob URL sa memory (walang server call ulit).
              Walang Drive link kahit kailan.
  TECHNICAL : Checks window._attachmentBlobCache first (instant second view).
              On cache miss: opens a blank tab immediately (popup-blocker safe)
              + writes a "Loading…" placeholder; calls gated downloadAttachment;
              base64 → Uint8Array → Blob → object URL → sets tab location
              (PDF/image inline) or closes tab + triggers <a download> (other).
              Caches the URL for 55 min (revoke after that). hideLoading + toast
              in every branch.
  PARAMS    : attachmentId — the ATTACHMENT_ID to fetch.
*/
async function viewAttachmentFile(attachmentId) {
  // Cache hit — second+ view is instant, no server call needed.
  const cached = window._attachmentBlobCache[attachmentId];
  if (cached) {
    window.open(cached.url, '_blank');
    return;
  }

  // Open tab now (must be synchronous inside the click handler to bypass blockers)
  // and write a Miga loading screen while the server call is in flight.
  // NOTE: this popup is a STANDALONE document (about:blank) that cannot load the
  // app's Stylesheet — so inline styles are unavoidable here. The hex values reuse
  // the existing palette (--gray-50 #f7f9fc, --gray-600 #5a6470, --navy-700 #134578).
  let previewWin = window.open('', '_blank');
  if (previewWin) {
    const migaSrc = (typeof migaImageFor === 'function') ? migaImageFor('default') : '';
    previewWin.document.write(
      '<!doctype html><html><head><title>Loading document…</title><style>' +
        'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f9fc;' +
          'color:#5a6470;margin:0;height:100vh;display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;}' +
        'img{width:130px;height:130px;object-fit:contain;' +
          'animation:bob 1.3s ease-in-out infinite;}' +
        '@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}' +
        'p{margin-top:18px;font-size:14px;font-weight:500;}' +
        '.dots::after{display:inline-block;width:1em;text-align:left;' +
          'content:"";animation:dots 1.4s steps(4,end) infinite;}' +
        '@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}' +
      '</style></head><body>' +
        (migaSrc ? '<img src="' + migaSrc + '" alt="Miga">' : '') +
        '<p>Miga is fetching your document<span class="dots"></span></p>' +
      '</body></html>'
    );
    previewWin.document.close();
  }

  showLoading('Opening file…');
  try {
    const res = await callServer('downloadAttachment', attachmentId);
    if (!res || !res.success) {
      hideLoading();
      if (previewWin) previewWin.close();
      showToast((res && res.error) || 'Could not open file.', 'error');
      return;
    }

    const byteChars = atob(res.base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: res.mimeType || 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);

    const previewable = /^(application\/pdf|image\/)/i.test(res.mimeType || '');
    if (previewable && previewWin) {
      previewWin.location = url;
      // Cache the URL — second view is instant. Revoke after 55 min.
      window._attachmentBlobCache[attachmentId] = { url, mimeType: res.mimeType };
      setTimeout(function () {
        URL.revokeObjectURL(url);
        delete window._attachmentBlobCache[attachmentId];
      }, 55 * 60 * 1000);
    } else {
      // Previewable file but the popup was blocked → fall back to a download,
      // and tell the user why they didn't get the inline preview.
      if (previewable && !previewWin) {
        showToast('Allow pop-ups to preview inline; downloading instead.', '');
      }
      if (previewWin) previewWin.close();
      const link = document.createElement('a');
      link.href = url;
      link.download = res.filename || 'attachment';
      document.body.appendChild(link);
      link.click();
      link.remove();
      // Downloads are one-off — no point caching; revoke immediately.
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }

    hideLoading();
  } catch (err) {
    hideLoading();
    if (previewWin) previewWin.close();
    showToast((err && err.message) || 'Server error.', 'error');
  }
}


// ─── PAGE RENDERER ─────────────────────────────────────────
/*
  Function Name: renderRequestDetailPage
  LAYMAN    : Ipakita ang buong detalye ng isang request sa requestor.
              Kung "Returned" ang status, lalabas ang Resubmit button sa kanang
              rail. Kung hindi siya ang may-ari → null lang ibabalik ng server
              at lalabas ang "not found" empty state.
  TECHNICAL : callServer('getRequestDetail',id); null → empty state. Two-column
              detail-layout: summary cards + attachments left; approvers chain +
              resubmit button right rail.
  PARAMS    : params — { id: requestId }.
  RETURNS   : HTML string.
*/
async function renderRequestDetailPage(params) {
  const id = params && params.id;
  if (!id) {
    return renderEmptyState({
      title:   'Missing request ID',
      message: 'No request was selected.',
      emotion: 'default',
    });
  }

  const detail = await callServer('getRequestDetail', id);
  if (!detail) {
    return renderEmptyState({
      title:   'Request not found',
      message: 'We could not find request ' + escapeHtml(id) + '.',
      emotion: 'declined',
    });
  }

  const isOwner       = state.user && detail.requestor && sameEmail(state.user.email, detail.requestor);
  const canResubmit   = isOwner && detail.status === 'Returned to Requestor';

  // Resubmit panel (main column): a FULL edit form — every field prefilled and
  // editable (except the approver group), flagged fields marked with the
  // approver's comment, plus the optional add-documents picker. The file picker
  // reuses the same global helpers + DOM ids as the new-request form — safe
  // because only one page renders at a time. Wired in afterRender_request().
  const resubmitPanel = canResubmit ? renderResubmitEditForm(detail, id) : '';

  return `
    <div class="page-header">
      <div>
        <div class="text-tiny text-muted">${escapeHtml(detail.controlNumber)}</div>
        <div class="page-title">${escapeHtml(detail.projectTitle)}</div>
        <div class="page-subtitle">${renderStatusBadge(detail.status)}${detail.isExpired ? ' <span class="badge badge-expired" title="Contract end date has passed">Expired</span>' : ''}</div>
      </div>
      <button class="btn btn-secondary" onclick="navigateTo('home')">← Back</button>
    </div>

    ${renderProgressSteps(detail)}
    ${renderResubmitBanner(detail)}
    ${renderFlagsCard(detail)}

    <div class="detail-layout">

      <div class="detail-main">
        ${renderRequestSummaryCards(detail)}
        ${renderAttachmentsBlock(detail, isOwner)}
        ${resubmitPanel}
        ${renderTimeline(detail.timeline)}
      </div>

      <div class="detail-rail">
        ${renderApproversChain(detail, true)}
      </div>

    </div>
  `;
}

/*
  Function Name: renderResubmitEditForm

  LAYMAN (Tropang Ex):
  Ang resubmit panel, ngayon isa nang buong edit form. Lahat ng field ng
  request ay naka-prefill at pwedeng baguhin (maliban sa approver group — hindi
  iyon napapalitan sa kalagitnaan). Ang mga field na minarkahan ng approver ay
  may amber na highlight at makikita ang komento sa ilalim mismo ng input. May
  file picker pa rin para sa dagdag na dokumento. Ligtas ito dahil laging
  bumabalik sa Approver 1 ang resubmit — lahat ng approver, makikita ulit ang
  bagong values.

  TECHNICAL:
  Fields render from detail.flaggableFields could not carry input types, so the
  layout mirrors NewRequest.html's markup/ids by hand (same field names, same
  .form-grid structure, same #location-select / #location-other pair reusing the
  global onLocationChange). Dates prefill from the raw contractStartInput /
  contractEndInput DTO keys. Unknown stored locations route through the Other +
  free-text path so a legitimate free-text location is never blanked. Flagged
  fields get .flag-pin under the input. Server-side validateResubmitPayload_ is
  the control; collectResubmitFields + validateResubmitForm are UX mirrors.

  PARAMS    : detail — DTO; id — requestId for the submit button.
  RETURNS   : the .card HTML string.
*/
function renderResubmitEditForm(detail, id) {
  const fl = openFieldFlags(detail);
  const KNOWN_LOCATIONS = ['AGT - Pending', 'GCP - Pending', 'EGP - Pending', 'TWS - Pending'];
  const locationKnown = KNOWN_LOCATIONS.indexOf(detail.location) !== -1;
  const locationBlank = !detail.location;

  const pin = function (key) {
    return fl[key]
      ? '<div class="flag-pin">' + renderIcon('flag', 12) + ' ' + escapeHtml(fl[key].comment) + '</div>'
      : '';
  };
  const rowCls = function (key) { return 'form-row' + (fl[key] ? ' detail-row--flagged' : ''); };
  const textRow = function (key, label, required, value) {
    return '' +
      '<div class="' + rowCls(key) + '">' +
        '<label class="form-label" for="' + key + '">' + escapeHtml(label) +
          (required ? ' <span class="required">*</span>' : '') + '</label>' +
        '<input type="text" class="form-input" id="' + key + '" name="' + key + '" value="' + escapeHtml(value == null ? '' : value) + '">' +
        pin(key) +
      '</div>';
  };

  const locationRow = '' +
    '<div class="' + rowCls('location') + '">' +
      '<label class="form-label" for="location-select">Location <span class="required">*</span></label>' +
      '<select class="form-select" name="location" id="location-select" onchange="onLocationChange(this.value)">' +
        '<option value=""' + (locationBlank ? ' selected' : '') + '>Select a location…</option>' +
        KNOWN_LOCATIONS.map(function (loc) {
          return '<option value="' + escapeHtml(loc) + '"' + (detail.location === loc ? ' selected' : '') + '>' + escapeHtml(loc) + '</option>';
        }).join('') +
        '<option value="Other"' + (!locationKnown && !locationBlank ? ' selected' : '') + '>Other</option>' +
      '</select>' +
      pin('location') +
    '</div>';
  const locationOtherRow = '' +
    '<div class="form-row' + (locationKnown || locationBlank ? ' hidden' : '') + '" id="location-other-row">' +
      '<label class="form-label" for="location-other">Specify location <span class="required">*</span></label>' +
      '<input type="text" class="form-input" name="locationOther" id="location-other" placeholder="Enter the location" ' +
        'value="' + (!locationKnown && !locationBlank ? escapeHtml(detail.location) : '') + '">' +
    '</div>';

  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Update and resubmit</div></div>' +
      '<p class="text-small text-muted" style="margin:0 0 12px;">' +
        'Every field below is editable and prefilled with the current values. ' +
        'Flagged fields are highlighted with the approver\'s comment. ' +
        'Add corrected or missing documents if needed (your original attachments are kept). ' +
        'Resubmitting routes the request back to Approver 1 from the start of the approval chain.' +
      '</p>' +
      '<form id="resubmit-form" autocomplete="off" onsubmit="return false;">' +
        '<div class="form-section-title">Request information</div>' +
        textRow('projectTitle', 'Project title', true, detail.projectTitle) +
        '<div class="form-grid">' +
          '<div class="form-row">' +
            '<label class="form-label">Approver group</label>' +
            '<input type="text" class="form-input" value="' + escapeHtml(detail.group || '') + '" disabled>' +
            '<span class="text-tiny text-muted">The approver group cannot be changed on resubmit.</span>' +
          '</div>' +
          textRow('requestorDesig', 'Requestor designation', false, detail.requestorDesig) +
        '</div>' +
        '<div class="form-grid">' +
          textRow('accountablePerson', 'Accountable person', true, detail.accountablePerson) +
          textRow('department', 'Department', true, detail.department) +
        '</div>' +
        '<div class="form-grid">' +
          locationRow +
          textRow('pcName', 'PC name', true, detail.pcName) +
        '</div>' +
        locationOtherRow +
        '<div class="form-grid">' +
          textRow('prism', 'PRISM', false, detail.prism) +
          textRow('purchaseOrder', 'Purchase Order', true, detail.purchaseOrder) +
        '</div>' +
        '<div class="form-grid">' +
          textRow('ihelpNumber', 'IHelp number', false, detail.ihelpNumber) +
          textRow('supplierName', 'Supplier name', true, detail.supplierName) +
        '</div>' +
        '<div class="form-section-title">Product</div>' +
        '<div class="form-grid">' +
          textRow('productType', 'Product type', true, detail.productType) +
          textRow('productName', 'Product name', true, detail.productName) +
        '</div>' +
        '<div class="form-grid">' +
          textRow('typeOfPurchase', 'Type of purchase', true, detail.typeOfPurchase) +
          textRow('typeOfLicense', 'Type of license', true, detail.typeOfLicense) +
        '</div>' +
        '<div class="form-section-title">Contract</div>' +
        '<div class="form-grid">' +
          '<div class="' + rowCls('contractStart') + '">' +
            '<label class="form-label" for="contractStart">Contract start date <span class="required">*</span></label>' +
            '<input type="date" class="form-input" id="contractStart" name="contractStart" ' +
              'value="' + escapeHtml(detail.contractStartInput || '') + '" ' +
              'oninput="var e=document.getElementById(\'contractEnd\'); if(e) e.min=this.value;">' +
            pin('contractStart') +
          '</div>' +
          '<div class="' + rowCls('contractEnd') + '">' +
            '<label class="form-label" for="contractEnd">Contract end date <span class="required">*</span></label>' +
            '<input type="date" class="form-input" id="contractEnd" name="contractEnd" ' +
              'value="' + escapeHtml(detail.contractEndInput || '') + '">' +
            pin('contractEnd') +
          '</div>' +
        '</div>' +
        '<div class="form-section-title">Purpose</div>' +
        '<div class="' + rowCls('requestorRemark') + '">' +
          '<label class="form-label" for="requestorRemark">Purpose / remark <span class="required">*</span></label>' +
          '<textarea class="form-textarea" id="requestorRemark" name="requestorRemark">' + escapeHtml(detail.requestorRemark || '') + '</textarea>' +
          pin('requestorRemark') +
        '</div>' +
      '</form>' +
      '<div class="form-section-title">Documents</div>' +
      '<div id="attachment-list"></div>' +
      '<div class="attachment-add-row">' +
        '<label class="btn btn-secondary file-input-label">' +
          '<input type="file" id="attachment-file-input" multiple style="display:none" ' +
                 'accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">' +
          '+ Add file' +
        '</label>' +
        '<span class="text-tiny text-muted">Max 5 MB per file · 15 MB total · 10 files max</span>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-primary" onclick="onResubmitClick(\'' + escapeHtml(id) + '\')">Resubmit request</button>' +
      '</div>' +
    '</div>';
}


// ─── ACTIONS ───────────────────────────────────────────────
/*
  Function Name: afterRender_request
  LAYMAN    : Router hook na tumatakbo pagkatapos ma-render ang detail page.
              Kung may resubmit panel (ibig sabihin Returned + ikaw ang may-ari),
              nire-reset ang file list at ikinakabit ang file-picker listener.
  TECHNICAL : Runs only when #attachment-file-input exists (resubmit panel
              present). Resets window._newRequestFiles (shared with the new-request
              picker), renders the empty list, and wires the change listener.
  PARAMS    : params — { id } (unused here).
*/
function afterRender_request(params) {
  // Clear cached blob URLs from any previous request detail view — they may
  // refer to different request's attachments now that we've navigated.
  window._attachmentBlobCache = {};

  const fileInput = document.getElementById('attachment-file-input');
  if (!fileInput) return; // no resubmit panel on this view → nothing to wire

  window._newRequestFiles = [];
  renderAttachmentList();

  fileInput.addEventListener('change', function (e) {
    onAttachmentFilesSelected(e.target.files);
    e.target.value = '';
  });
}


/*
  Function Name: collectResubmitFields
  LAYMAN    : Basahin ang lahat ng values sa edit form, i-collapse ang Location
              "Other" sa isang value, at ibalik bilang { fieldKey: value }.
  TECHNICAL : Reads by element id for the 17 editable keys (same key set as
              FLAGGABLE_FIELDS server-side). Mirrors NewRequest's locationOther
              collapse. Returns null when the form is absent (defensive).
*/
function collectResubmitFields() {
  const form = document.getElementById('resubmit-form');
  if (!form) return null;
  const val = function (id) {
    const el = document.getElementById(id);
    return el ? String(el.value).trim() : '';
  };
  const fields = {
    projectTitle:      val('projectTitle'),
    requestorDesig:    val('requestorDesig'),
    accountablePerson: val('accountablePerson'),
    department:        val('department'),
    location:          val('location-select'),
    pcName:            val('pcName'),
    prism:             val('prism'),
    purchaseOrder:     val('purchaseOrder'),
    ihelpNumber:       val('ihelpNumber'),
    productType:       val('productType'),
    productName:       val('productName'),
    typeOfPurchase:    val('typeOfPurchase'),
    typeOfLicense:     val('typeOfLicense'),
    contractStart:     val('contractStart'),
    contractEnd:       val('contractEnd'),
    supplierName:      val('supplierName'),
    requestorRemark:   val('requestorRemark'),
  };
  if (fields.location === 'Other') fields.location = val('location-other');
  return fields;
}

/*
  Function Name: validateResubmitForm
  LAYMAN    : Chinecheck bago ipadala: kumpleto ba ang mga required na field at
              tama ba ang date order. UX mirror lang ito — ang server pa rin
              (validateResubmitPayload_) ang tunay na kontrol.
  TECHNICAL : Required set = NewRequest's required fields minus group. Returns
              an error string or null.
*/
function validateResubmitForm(fields) {
  const required = {
    projectTitle: 'Project title', accountablePerson: 'Accountable person',
    department: 'Department', location: 'Location', pcName: 'PC name',
    purchaseOrder: 'Purchase Order', supplierName: 'Supplier name',
    productType: 'Product type', productName: 'Product name',
    typeOfPurchase: 'Type of purchase', typeOfLicense: 'Type of license',
    contractStart: 'Contract start date', contractEnd: 'Contract end date',
    requestorRemark: 'Purpose / remark',
  };
  const missing = Object.keys(required)
    .filter(function (k) { return !fields[k]; })
    .map(function (k) { return required[k]; });
  if (missing.length) return 'Please fill in: ' + missing.join(', ');
  if (fields.contractStart && fields.contractEnd && fields.contractEnd < fields.contractStart) {
    return 'Contract end date cannot be earlier than the contract start date.';
  }
  return null;
}

/*
  Function Name: onResubmitClick
  LAYMAN    : Pag pinindot ang "Resubmit request": i-validate ang edit form at
              ang descriptions ng bagong files, kumpirmahin (sinasabi kung may
              field edits at/o files), i-read ang files bilang base64, tapos
              ipadala sa server. Refresh para makita ang status.
  TECHNICAL : collectResubmitFields + validateResubmitForm (UX mirrors of
              validateResubmitPayload_) → showConfirm → Promise.all(
              readFileAsBase64) → callServer('handleResubmit', requestId, files,
              fields). hideLoading + toast in every branch.
  PARAMS    : requestId — the request to resubmit.
*/
async function onResubmitClick(requestId) {
  const files = window._newRequestFiles || [];

  // Any added file needs a description (client-side fast feedback).
  for (let i = 0; i < files.length; i++) {
    if (!files[i].description || !String(files[i].description).trim()) {
      showToast('Please add a description for: ' + files[i].file.name, 'error');
      return;
    }
  }

  // The edit form: required fields + date order (server re-validates).
  const fields = collectResubmitFields();
  if (fields) {
    const err = validateResubmitForm(fields);
    if (err) { showToast(err, 'error'); return; }
  }

  const fileNote = files.length
    ? files.length + ' document(s) will be added (your original attachments are kept). '
    : 'No new documents added — your original attachments will be reused. ';
  const ok = await showConfirm({
    title:        'Resubmit request',
    message:      'Your field values will be saved as shown in the form. ' + fileNote +
                  'The request will be routed back to Approver 1 from the start. Continue?',
    confirmLabel: 'Resubmit',
  });
  if (!ok) return;

  showLoading(files.length ? 'Uploading files and resubmitting…' : 'Resubmitting…');

  // Read any added files as base64 before sending.
  let filePayloads = [];
  try {
    filePayloads = await Promise.all(files.map(function (item) {
      return readFileAsBase64(item.file).then(function (base64) {
        return {
          filename:    item.file.name,
          mimeType:    item.file.type || 'application/octet-stream',
          base64:      base64,
          description: String(item.description).trim(),
        };
      });
    }));
  } catch (readErr) {
    hideLoading();
    showToast((readErr && readErr.message) || 'Failed to read files.', 'error');
    return;
  }

  try {
    const result = await callServer('handleResubmit', requestId, filePayloads, fields);
    if (result && result.success) {
      hideLoading();
      showToast('Request resubmitted.', 'success');
      navigateTo('request', { id: requestId });
    } else {
      hideLoading();
      showToast((result && result.error) || (result && result.message) || 'Failed to resubmit.', 'error');
    }
  } catch (err) {
    hideLoading();
    showToast((err && err.message) || 'Server error.', 'error');
  }
}
</script>
