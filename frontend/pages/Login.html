<!-- Login.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: Login.html  (page)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang unang nakikita ng user habang nag-aabang ang app ng confirmation
  galing sa Google kung sino siya. May dalawang estado: (1) loading splash
  na may Miga at spinner — normal flow habang nag-aabang, at (2) error state
  kapag hindi matukoy ang Google account.

  TECHNICAL:
  Transitional page — bootstrap() navigates here first, then immediately
  routes to the real destination once getCurrentUser() resolves. On error,
  bootstrap() sets window.__loginError before navigating here with {error:true}.

  FUNCTIONS:
    - renderLoginPage(params)    happy-path splash | error fallback
-->


<script>
/*
  Function Name: renderLoginPage
  LAYMAN    : Ipakita ang loading screen o ang error page, depende kung may
              problema sa pag-sign-in.
  TECHNICAL : Two branches: params.error=true → error state using
              window.__loginError; else → welcome spinner (auto-advances when
              bootstrap() finishes and calls navigateTo again).
  PARAMS    : params — { error?: true } passed by bootstrap on failure.
  RETURNS   : HTML string.
*/
async function renderLoginPage(params) {
  // Error fallback — bootstrap sets window.__loginError before navigating here.
  if (params && params.error) {
    const errorMsg = window.__loginError ||
      'We could not complete sign-in. Please reload and try again.';
    const body =
      '<div class="text-muted mb-md">' + escapeHtml(errorMsg) + '</div>' +
      '<button class="btn btn-primary" onclick="location.reload()">Try again</button>';
    return renderEmptyState({
      title:   'Sign-in problem',
      message: body,
      emotion: 'declined',
    });
  }

  // Happy-path splash — auto-advances when bootstrap finishes.
  return '<div class="loading">' +
    '<img class="miga-img" src="' + migaImageFor('welcome') + '" ' +
         'alt="Miga" style="display:block;margin:0 auto 12px;">' +
    '<div class="spinner"></div>' +
    '<div>Welcome — preparing your workspace…</div>' +
  '</div>';
}
</script>
