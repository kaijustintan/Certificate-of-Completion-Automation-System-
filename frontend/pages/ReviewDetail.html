<!-- ReviewDetail.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: ReviewDetail.html  (page — approver view)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Ito ang review page ng approver — may buong detalye ng request at ang
  "Your decision" action card sa right rail (Approve / Return to Requestor /
  Decline). Ang decline at return ay may inline panel na lumabas para sa remark.
  Kapag hindi ang naka-login ang dapat kumilos, lalabas ang "locked notice"
  imbes na action buttons.

  TECHNICAL:
  Two-column layout: main content left (shared helpers from RequestDetail.html),
  action rail right (approver chain + locked notice/action bar). Action bar is
  sticky in the rail (position:sticky on .detail-rail). Action handlers share
  runReviewAction() for consistent loading + lock behavior.

  SHARED HELPERS USED (defined in RequestDetail.html):
  renderProgressSteps, renderRequestSummaryCards, renderApproversChain,
  renderAttachmentsBlock, renderResubmitBanner, getConfiguredApproverSlots

  FUNCTIONS (this file only):
    - renderReviewDetailPage(params)     main renderer; getRequestDetail + auth check
    - renderPreviousApprovalNote()       amber notice if approver approved in prior cycle
    - isCurrentApproverFor()             is the session user the one due to act?
    - renderLockedNotice()               card explaining why the user can't act
    - renderActionBar()                  "Your decision" card + inline decline/return panels
    - openReviewPanel(panelId)           show decline or return panel; hide action buttons
    - closeReviewPanels()               restore action buttons; hide all panels
    - setActionItemHidden(btnId, hidden) show/hide a button's .action-item wrapper
    - syncPanelButton(kind)              enable/disable submit when textarea is filled
    - onApproveClick()                  showConfirm → runReviewAction('handleApprove', 'Approving…')
    - onDeclineSubmit()                 showConfirm → runReviewAction('handleDecline', 'Declining…')
    - onReturnSubmit()                  runReviewAction('handleReturn', 'Returning…')
    - runReviewAction()                 shared: lockButtons + showLoading + callServer
    - lockActionButtons()               disables all .action-btn during a call
    - unlockActionButtons()             re-enables on failure so user can retry
-->


<script>
// Stash the current request detail so the action handlers can read
// it without re-fetching. Cleared between renders.
let __reviewDetail = null;

// Minimum characters for a decline/return reason.
// ⚠️ MUST MATCH MIN_REMARK in validateRemark_() (backend/Approvals.js). That
// function is the actual control; this constant only drives the counter and the
// disabled state so the approver is not rejected after typing.
const REVIEW_MIN_REMARK = 20;


/*
  Function Name: renderReviewDetailPage
  LAYMAN    : Ipakita ang buong review page ng approver para sa isang request.
              Kung hindi siya ang current approver, lalabas ang locked notice
              imbes na action bar. May resubmit banner at previous-approval note
              kapag naaangkop.
  TECHNICAL : callServer('getRequestDetail',id); null → empty state. Two-column
              detail-layout: shared info cards left; approver chain + locked/action
              right rail. __reviewDetail set for action handlers.
  PARAMS    : params — { id: requestId }.
  RETURNS   : HTML string.
*/
async function renderReviewDetailPage(params) {
  const id = params && params.id;
  if (!id) {
    return renderEmptyState({
      title:   'Missing request ID',
      message: 'No request was selected.',
      emotion: 'default',
    });
  }

  const detail = await callServer('getRequestDetail', id);
  if (!detail) {
    return renderEmptyState({
      title:   'Request not found',
      message: 'We could not find request ' + escapeHtml(id) + '.',
      emotion: 'declined',
    });
  }

  __reviewDetail = detail;

  const userEmail   = (state.user && state.user.email) || '';
  const canAct      = isCurrentApproverFor(detail, userEmail);
  const lockedNotice = !canAct
    ? renderLockedNotice(detail, userEmail)
    : '';

  const actionBar = canAct ? renderActionBar() : '';

  // If this approver previously approved (before a later return + resubmit),
  // remind them — shown only when they're the current approver re-reviewing.
  const prevApprovalNote = canAct ? renderPreviousApprovalNote(detail, userEmail) : '';

  return `
    <div class="page-header">
      <div>
        <div class="text-tiny text-muted">${escapeHtml(detail.controlNumber)}</div>
        <div class="page-title">${escapeHtml(detail.projectTitle)}</div>
        <div class="page-subtitle">${renderStatusBadge(detail.status)}${detail.isExpired ? ' <span class="badge badge-expired" title="Contract end date has passed">Expired</span>' : ''}</div>
      </div>
      <button class="btn btn-secondary" onclick="navigateTo('approverDashboard')">← Pending list</button>
    </div>

    ${renderProgressSteps(detail)}
    ${renderResubmitBanner(detail)}
    ${prevApprovalNote}

    <div class="detail-layout">

      <div class="detail-main">
        ${renderRequestSummaryCards(detail)}
        ${renderAttachmentsBlock(detail, false)}
      </div>

      <div class="detail-rail">
        ${renderApproversChain(detail, false)}
        ${lockedNotice}
        ${actionBar}
      </div>

    </div>
  `;
}


// Reminds the current approver if they already approved this request in an
// earlier cycle (captured in Resubmit_History before resubmit cleared dates).
// Returns '' if the active user isn't among the recorded previous approvals.
/*
  Function Name: renderPreviousApprovalNote
  LAYMAN    : Kapag nag-approve na ang approver noon (bago i-return ng next
              approver), ipakita ang reminder: "Nag-approve ka noon — re-review
              mo please base sa bagong pagbabalik."
  TECHNICAL : Checks detail.priorApprovals — approvals from an EARLIER cycle
              (before the latest return + resubmit). This list is empty unless
              the request has actually been resubmitted, so the note never
              misfires during normal step progression, and correctly fires for
              the prior approver after a resubmit. Returns '' if the caller has
              no approval in a prior cycle.
*/
function renderPreviousApprovalNote(detail, userEmail) {
  const mine = (detail.priorApprovals || []).find(function (a) {
    return sameEmail(a.email, userEmail);
  });
  if (!mine) return '';
  return '' +
    '<div class="resubmit-banner mt-sm">' +
      '<strong>Note:</strong> You previously approved this request on ' +
      escapeHtml(mine.date) + '. Please re-review in light of the return reason above.' +
    '</div>';
}


// Returns true if the active user is the approver currently waiting on this request.
/*
  Function Name: isCurrentApproverFor
  LAYMAN    : Ang naka-login ba ang dapat kumilos sa request ngayon? Para lang
              malaman kung ipapakita ang action bar o ang locked notice.
  TECHNICAL : Returns true if status starts with "Pending Approver" AND the user
              matches the current-step slot in the configured approvers.
  PARAMS    : detail — DTO; userEmail — session email.
  RETURNS   : Boolean.
*/
function isCurrentApproverFor(detail, userEmail) {
  if (!detail || !userEmail) return false;
  if (!String(detail.status || '').startsWith('Pending Approver')) return false;

  const slots = getConfiguredApproverSlots(detail);
  const step  = Number(detail.step) || 0;
  const slot  = slots.find(function (s) { return s.n === step; });
  return !!(slot && sameEmail(slot.approver, userEmail));
}


// Inline notice shown when the active user is not allowed to act on this request.
/*
  Function Name: renderLockedNotice
  LAYMAN    : Kapag hindi ang naka-login ang dapat kumilos, ipakita ang card na
              nagsasabing "Hindi ka ang dapat kumilos dito" at kung bakit.
  TECHNICAL : Returns a .card with Miga + contextual reason (not your request,
              different step, already declined/approved/returned, etc.).
  PARAMS    : detail — DTO; userEmail — session email.
  RETURNS   : HTML string (.card), or '' if user can act.
*/
function renderLockedNotice(detail, userEmail) {
  let reason;
  if (!userEmail) {
    reason = 'You are not signed in as an approver.';
  } else if (detail.status === 'Fully Approved') {
    reason = 'This request is already fully approved — no further action is needed.';
  } else if (detail.status === 'Declined') {
    reason = 'This request has been declined.';
  } else if (detail.status === 'Returned to Requestor') {
    reason = 'This request was returned to the requestor and is awaiting their update.';
  } else {
    reason = 'You are not the current approver for this step.';
  }

  return '' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">No action available</div></div>' +
      renderMiga('default', reason) +
    '</div>';
}


// ─── ACTION BAR + INLINE PANELS ────────────────────────────
/*
  Function Name: renderActionBar
  LAYMAN    : Gumawa ng "Your decision" card na may Approve, Return, at Decline
              buttons. Kasama rin ang 2 hidden panels na lalabas kapag pinindot ang
              Return o Decline para makapag-enter ng remark.
  TECHNICAL : Returns HTML for the .action-card + #decline-panel + #return-panel
              (both start .hidden). Buttons are .action-btn class (for lock/unlock).
  NOTE      : The class .action-card scopes the vertical-stack CSS for buttons
              in the narrow rail layout.
*/
function renderActionBar() {
  return '' +
    '<div class="card action-card">' +
      '<div class="card-header"><div class="card-title">Your decision</div></div>' +
      renderMiga('pending', 'Approve to route this to the next signatory, decline to close it out, or return it to the requestor for changes.') +
      '<div class="form-actions">' +
        '<div class="action-item">' +
          '<button class="btn btn-warning action-btn" id="btn-return" onclick="openReviewPanel(\'return-panel\')">Return to requestor</button>' +
          '<span class="text-tiny text-muted">Send back to requestor for revision</span>' +
        '</div>' +
        '<div class="action-item">' +
          '<button class="btn btn-danger action-btn" id="btn-decline" onclick="openReviewPanel(\'decline-panel\')">Decline</button>' +
          '<span class="text-tiny text-muted">Permanently reject this request</span>' +
        '</div>' +
        '<div class="action-item">' +
          '<button class="btn btn-success action-btn" id="btn-approve" onclick="onApproveClick()">Approve</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    // Decline panel
    '<div id="decline-panel" class="card hidden">' +
      '<div class="card-header"><div class="card-title">Decline this request</div></div>' +
      '<p class="text-muted mb-md">Provide a reason for declining. The requestor will receive this in the notification email and the request will be closed (it cannot be resubmitted).</p>' +
      '<textarea class="form-textarea" id="decline-remark" placeholder="Reason for decline (required, at least ' + REVIEW_MIN_REMARK + ' characters)…" oninput="syncPanelButton(\'decline\')"></textarea>' +
      '<div class="text-tiny text-muted" id="decline-remark-count">0 / ' + REVIEW_MIN_REMARK + ' characters minimum</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-secondary" onclick="closeReviewPanels()">Cancel</button>' +
        '<button class="btn btn-danger action-btn" id="decline-submit" disabled onclick="onDeclineSubmit()">Confirm decline</button>' +
      '</div>' +
    '</div>' +

    // Return panel
    '<div id="return-panel" class="card hidden">' +
      '<div class="card-header"><div class="card-title">Return to requestor</div></div>' +
      '<p class="text-muted mb-md">Describe what needs to be changed. The requestor will receive this in the notification email and can update and resubmit.</p>' +
      '<textarea class="form-textarea" id="return-remark" placeholder="What needs to change (required, at least ' + REVIEW_MIN_REMARK + ' characters)…" oninput="syncPanelButton(\'return\')"></textarea>' +
      '<div class="text-tiny text-muted" id="return-remark-count">0 / ' + REVIEW_MIN_REMARK + ' characters minimum</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-secondary" onclick="closeReviewPanels()">Cancel</button>' +
        '<button class="btn btn-warning action-btn" id="return-submit" disabled onclick="onReturnSubmit()">Confirm return</button>' +
      '</div>' +
    '</div>';
}

/*
  Function Name: openReviewPanel
  LAYMAN    : Ipakita ang decline o return remark panel; itago ang ibang
              action buttons para focused ang UX.
  TECHNICAL : Removes .hidden from the target panel; hides the other action
              buttons via setActionItemHidden.
  PARAMS    : panelId — 'decline-panel' | 'return-panel'.
*/
function openReviewPanel(panelId) {
  closeReviewPanels();
  const el = document.getElementById(panelId);
  if (!el) return;
  el.classList.remove('hidden');

  // Focus the approver on the single action they chose — hide the others.
  if (panelId === 'decline-panel') {
    setActionItemHidden('btn-approve', true);
    setActionItemHidden('btn-return',  true);
  } else if (panelId === 'return-panel') {
    setActionItemHidden('btn-approve', true);
    setActionItemHidden('btn-decline', true);
  }

  const textarea = el.querySelector('textarea');
  if (textarea) textarea.focus();
}

/*
  Function Name: closeReviewPanels
  LAYMAN    : Itago ang decline/return panel at ibalik ang action buttons.
              Tinatawag ng Cancel buttons sa loob ng mga panel.
  TECHNICAL : Adds .hidden to both panels; restores action button visibility.
*/
function closeReviewPanels() {
  ['decline-panel', 'return-panel'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
  // Restore all top-level action buttons.
  setActionItemHidden('btn-approve', false);
  setActionItemHidden('btn-return',  false);
  setActionItemHidden('btn-decline', false);
}

// Shows/hides a top-level action button by toggling its .action-item wrapper.
// Restoring via display='' reverts to the CSS-defined flex layout.
function setActionItemHidden(btnId, hidden) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const wrap = btn.closest('.action-item') || btn;
  wrap.style.display = hidden ? 'none' : '';
}

// Enable/disable the submit button based on textarea content.
/*
  Function Name: syncPanelButton

  LAYMAN (Tropang Ex):
  Habang nagta-type ang approver ng dahilan, ito ang nag-a-update ng counter sa
  ilalim ng textarea at nagbubukas ng "Confirm decline/return" button. Bubukas
  lang ito kapag umabot na sa minimum na haba. Ganito para hindi maka-decline ang
  approver nang walang paliwanag na mababasa ng requestor.

  TECHNICAL:
  Reads the textarea, writes the live counter, and enables/disables the matching
  submit button on a trimmed length >= REVIEW_MIN_REMARK.

  ⚠️ UX MIRROR, NOT THE CONTROL. validateRemark_() in Approvals.js is what
  actually enforces this, because decline_/returnRequest_ are reachable directly
  via google.script.run. REVIEW_MIN_REMARK must stay in sync with MIN_REMARK there.

  PARAMS    : kind — 'decline' | 'return'.
  RETURNS   : (void)
*/
function syncPanelButton(kind) {
  const remark = document.getElementById(kind + '-remark');
  const button = document.getElementById(kind + '-submit');
  if (!remark || !button) return;

  const len = remark.value.trim().length;
  button.disabled = len < REVIEW_MIN_REMARK;

  const counter = document.getElementById(kind + '-remark-count');
  if (counter) {
    counter.textContent = len >= REVIEW_MIN_REMARK
      ? len + ' characters'
      : len + ' / ' + REVIEW_MIN_REMARK + ' characters minimum';
  }
}


// ─── ACTIONS ───────────────────────────────────────────────
async function onApproveClick() {
  const id = __reviewDetail && __reviewDetail.requestId;
  if (!id) return;

  // Are you the final signatory? You are if no CONFIGURED approver slot comes
  // after your current step (approve() skips blank slots, so we mirror that by
  // looking at configured slots only — same rule the server uses).
  const slots = getConfiguredApproverSlots(__reviewDetail);
  const step  = Number(__reviewDetail.step) || 0;
  const isFinalApprover = !slots.some(function (s) { return s.n > step; });

  const message = isFinalApprover
    ? 'You are the final signatory. Approving will mark this request FULLY APPROVED and notify the requestor. Continue?'
    : 'Approving will forward this request to the next approver and send the requestor a progress update. Continue?';

  const ok = await showConfirm({
    title:        'Approve request',
    message:      message,
    confirmLabel: 'Approve',
  });
  if (!ok) return;
  await runReviewAction('handleApprove', [id], 'Request approved.', 'Approving…');
}

async function onDeclineSubmit() {
  const id     = __reviewDetail && __reviewDetail.requestId;
  const remark = (document.getElementById('decline-remark') || {}).value;
  if (!id || !remark || remark.trim().length < REVIEW_MIN_REMARK) return;

  const ok = await showConfirm({
    title:        'Decline request',
    message:      'This will permanently close the request. The requestor will not be able to resubmit it. Continue?',
    confirmLabel: 'Decline',
    danger:       true,
  });
  if (!ok) return;
  await runReviewAction('handleDecline', [id, remark.trim()], 'Request declined.', 'Declining…');
}

async function onReturnSubmit() {
  const id     = __reviewDetail && __reviewDetail.requestId;
  const remark = (document.getElementById('return-remark') || {}).value;
  if (!id || !remark || remark.trim().length < REVIEW_MIN_REMARK) return;

  await runReviewAction('handleReturn', [id, remark.trim()], 'Request returned to the requestor.', 'Returning…');
}


// Shared action runner — disables the action bar, calls the server,
// shows a toast, and routes back to the pending list.
/*
  Function Name: runReviewAction
  LAYMAN    : Shared runner para sa Approve, Decline, at Return. Nagla-lock ng
              buttons, nagpapakita ng loading overlay, tinatawag ang server, at
              (kapag tagumpay) nag-navigate pabalik sa dashboard. Kapag nag-fail,
              nag-ibalik ng buttons para makapag-retry.
  TECHNICAL : lockActionButtons + showLoading → callServer → on success hideLoading
              + navigateTo('approverDashboard'); on failure hideLoading + showToast
              + unlockActionButtons.
  PARAMS    : serverFn — function name; args — array of args; successMessage —
              toast text; loadingMessage — overlay label.
*/
async function runReviewAction(serverFn, args, successMessage, loadingMessage) {
  lockActionButtons();
  showLoading(loadingMessage);
  try {
    const result = await callServer.apply(null, [serverFn].concat(args));
    if (result && result.success) {
      hideLoading();
      showToast(successMessage, 'success');
      navigateTo('approverDashboard');
    } else {
      hideLoading();
      showToast((result && result.message) || 'Action failed.', 'error');
      unlockActionButtons();
    }
  } catch (err) {
    hideLoading();
    showToast((err && err.message) || 'Server error.', 'error');
    unlockActionButtons();
  }
}

// Locks every action button (top bar + panel confirms) the instant a
// server action starts, so a rapid double-click can't fire it twice
// before the UI updates.
/*
  Function Name: lockActionButtons
  LAYMAN    : I-disable ang lahat ng action buttons para hindi makapag-double-click
              habang naghihintay ang server.
  TECHNICAL : Sets disabled=true, opacity=0.5, cursor=not-allowed on all .action-btn.
*/
function lockActionButtons() {
  document.querySelectorAll('.action-btn').forEach(function (btn) {
    btn.disabled      = true;
    btn.style.opacity = '0.5';
    btn.style.cursor  = 'not-allowed';
  });
}

// Re-enables the action buttons after a FAILED action so the approver
// can retry. On success the page navigates away, so no unlock is needed.
/*
  Function Name: unlockActionButtons
  LAYMAN    : I-re-enable ang action buttons kapag may error — para makapag-retry
              ang approver. Hindi kailangan sa success kasi lalayo na sa page.
  TECHNICAL : Restores disabled=false, clears opacity/cursor overrides on .action-btn.
*/
function unlockActionButtons() {
  document.querySelectorAll('.action-btn').forEach(function (btn) {
    btn.disabled      = false;
    btn.style.opacity = '';
    btn.style.cursor  = '';
  });
}
</script>
