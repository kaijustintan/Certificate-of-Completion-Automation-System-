<!-- ════════════════════════════════════════════════════════════
     FILE: Index.html — SPA shell served by doGet()
     ════════════════════════════════════════════════════════════

     LAYMAN (Tropang Ex):
     Ito ang "balat" ng buong web app — isang HTML file lang ang
     pinapadala sa browser. Lahat ng ibang pages ay nilo-load dito
     bilang <script> includes at ino-render sa #app div ng router.

     TECHNICAL:
     Evaluated by HtmlService (Apps Script templating). Template
     variables: initialPage, initialId — set by doGet() for deep-links
     and emitted into window.__INITIAL_ROUTE for bootstrap() to read.

     LOAD ORDER (critical — do not reorder):
       1. Stylesheet.html              — global CSS
       2. Components (StatusBadge, EmptyState, MigaWidget)
       3. Pages (Login, Dashboard, NewRequest, RequestDetail,
                  ApproverDashboard, ReviewDetail, Admin)
       4. window.__INITIAL_ROUTE scriptlet
       5. JavaScript.html             — router + bootstrap (last, needs all render fns)

     NOTE: deep-links use query params (?page=&id=), NOT hash fragments.
     The sandboxed iframe can't read the outer URL hash, but doGet()
     receives query params server-side and forwards them here.
═══════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Certificate Portal — Megaworld</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <?!= include('frontend/Stylesheet'); ?>
</head>

<body>

  <div class="app-shell">

    <?!= include('frontend/components/Navbar'); ?>

    <main class="app-main">
      <div id="app">
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading portal…</div>
        </div>
      </div>
    </main>

  </div>

  <div id="toast" class="toast"></div>

  <!-- Components — must load BEFORE pages that reference them -->
  <?!= include('frontend/components/StatusBadge'); ?>
  <?!= include('frontend/components/EmptyState'); ?>
  <?!= include('frontend/components/MigaWidget'); ?>

  <!-- Pages — each defines its own render function -->
  <?!= include('frontend/pages/Login'); ?>
  <?!= include('frontend/pages/Dashboard'); ?>
  <?!= include('frontend/pages/NewRequest'); ?>
  <?!= include('frontend/pages/RequestDetail'); ?>
  <?!= include('frontend/pages/ApproverDashboard'); ?>
  <?!= include('frontend/pages/ReviewDetail'); ?>
  <?!= include('frontend/pages/Admin'); ?>

  <!-- Deep-link target forwarded by doGet() via query params (?page=&id=).
       bootstrap() reads this before falling back to hash/role-home. -->
  <script>
    window.__INITIAL_ROUTE = { page: "<?= initialPage ?>", id: "<?= initialId ?>" };
  </script>

  <!-- JavaScript router LAST — needs all the render functions defined above -->
  <?!= include('frontend/JavaScript'); ?>

</body>
</html>
