<!--
  ════════════════════════════════════════════════════════════
  FILE: Stylesheet.html — Global CSS for the entire portal
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Lahat ng kulay, spacing, card styles, buttons, at layout rules
  ng portal ay narito. Isang lugar lang para sa lahat ng CSS para
  consistent ang design sa bawat page. Huwag maglagay ng CSS sa
  ibang files — palaging dito.

  TECHNICAL:
  Included as a <?!= include('frontend/Stylesheet'); ?> scriptlet
  in Index.html. Defines the :root design-token variables consumed
  by all other CSS rules. One file = one global stylesheet.

  ────────────────────────────────────────────────────────────
  SECTIONS (search by comment header)
  ────────────────────────────────────────────────────────────
  RESET                  box-sizing, body defaults, font-smoothing
  DESIGN TOKENS (:root)  all color + layout custom properties
  TYPOGRAPHY             h1/h2/h3, p, a, .text-muted/.text-small
  LAYOUT — APP SHELL     .app-shell (flex-row), .app-main (1280px max), .page-header
  SIDEBAR                .sidebar + .navbar-brand/links/user (was top navbar)
  CARDS                  .card, .card-header, .card-title
  STAT CARDS             .stat-grid, .stat-card + clickable/active variants,
                         .stat-number (+ .blue/.green/.red/.amber), .stat-label
  BUTTONS                .btn + 5 variants (primary/secondary/success/warning/danger)
  BADGES                 .badge + 5 status variants
  TABLES                 .data-table (header/body/hover)
  FORMS                  .form-section, .form-grid, .form-label, .form-input/select/textarea, .form-actions
  DETAIL ROWS            .detail-row, .detail-key, .detail-value
  PROGRESS STEPS         .progress-steps, .step-dot (done/active/declined), .step-line
  RESUBMIT BANNER        .resubmit-banner
  ACTION BAR             .action-item, .form-actions
  FILTER BAR             .filter-bar, .filter-group, .filter-label, .filter-select
  TWO-COLUMN LAYOUT      .detail-layout, .detail-main, .detail-rail, .action-card overrides
  LOADING OVERLAY        .loading-overlay, .loading-box, .loading-msg
  TOASTS                 .toast + .success/.error
  CONFIRM MODAL          .modal-overlay, .modal, .modal-title/.message/.actions
  MIGA WIDGET            .miga-widget, .miga-img, .miga-bubble-*
  EMPTY STATE            .empty-state
  LOGIN SPLASH           .login-shell, .login-card
  TAB ROW                .tab-row, .tab, .tab-count (kept for reference)
  ADMIN CONSOLE          .admin-groups-head, .admin-group-card/-title/-name/-meta/-actions,
                         .admin-inline-form, .admin-warn, .admin-chain-editor,
                         .chain-slot-row, .chain-slot-seq
  UTILITIES              .hidden, .flex, .gap-sm/md, .mt/mb-sm/md, .text-right, .required
  RESPONSIVE             @media (max-width:1024px), (max-width:768px), (max-width:640px)
-->
<style>
  /* ============================================================
     STYLESHEET.HTML
     Global styles for the entire Megaworld E-Certificate Portal.
     Organized by section — search by comment header.
     ============================================================ */


  /* ─── RESET ─────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #1a1a1a;
    background: #f7f9fc;
    -webkit-font-smoothing: antialiased;
  }


  /* ─── DESIGN TOKENS ─────────────────────────────────────── */
  :root {
    /* Primary brand colors */
    --navy-900: #0a2744;   /* primary dark navy */
    --navy-800: #0d3460;
    --navy-700: #134578;
    --navy-100: #e6f1fb;   /* light navy tint */

    /* Neutrals */
    --white:    #ffffff;
    --gray-50:  #f7f9fc;   /* page background */
    --gray-100: #f1f4f8;   /* card background secondary */
    --gray-200: #e5eaf0;   /* borders */
    --gray-400: #9aa5b1;   /* muted text */
    --gray-600: #5a6470;   /* secondary text */
    --gray-900: #1a1a1a;   /* primary text */

    /* Semantic colors */
    --blue-bg:    #e6f1fb;
    --blue-text:  #185fa5;
    --green-bg:   #eaf3de;
    --green-text: #3b6d11;
    --amber-bg:   #faeeda;
    --amber-text: #ba7517;
    --red-bg:     #fcebeb;
    --red-text:   #a32d2d;
    --purple-bg:  #eeedfe;
    --purple-text: #534ab7;

    /* Layout */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(10, 39, 68, 0.04);
    --shadow-md: 0 2px 8px rgba(10, 39, 68, 0.08);
    --shadow-lg: 0 8px 24px rgba(10, 39, 68, 0.12);

    /* Semantic aliases — role-named tokens over the raw ramps above.
       Several rules (.filter-*, .modal-*) already referenced these names
       while they were undefined (silent browser-default fallback); defining
       them here fixes those rules with zero selector rewrites. Prefer these
       aliases in new CSS so a future re-theme touches only this block. */
    --bg:             var(--gray-50);    /* page background */
    --surface:        var(--white);      /* cards */
    --border:         var(--gray-200);
    --text-primary:   var(--gray-900);
    --text-secondary: var(--gray-600);
    --text-muted:     var(--gray-400);
    --primary:        var(--navy-900);
    --accent:         var(--blue-text);  /* links + active states */
    --radius:         var(--radius-md);
    --focus-ring:     0 0 0 3px rgba(24, 95, 165, 0.25);
  }


  /* ─── TYPOGRAPHY ────────────────────────────────────────── */
  h1 { font-size: 28px; font-weight: 600; color: var(--gray-900); }
  h2 { font-size: 18px; font-weight: 500; color: var(--gray-900); }
  h3 { font-size: 16px; font-weight: 500; color: var(--gray-900); }
  p  { color: var(--gray-900); }
  a  { color: var(--blue-text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .text-muted { color: var(--gray-600); }
  .text-small { font-size: 12px; }
  .text-tiny  { font-size: 11px; }


  /* ─── LAYOUT — APP SHELL ────────────────────────────────── */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: row; /* sidebar + content side by side */
  }

  .app-main {
    flex: 1;
    min-width: 0;         /* prevent flex-row table/grid overflow */
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 32px 64px;
  }

  .page-header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Display tier — Inter wants slight negative tracking at 20px+ */
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 4px; }
  .page-subtitle { font-size: 13px; color: var(--gray-600); }


  /* ─── SIDEBAR (was NAVBAR — same inner IDs/classes, no JS change needed) ─ */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--navy-900);
    color: var(--white);
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 100;
  }
  .navbar-brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--white);
    cursor: pointer;
    padding: 24px 20px 20px;
    line-height: 1.4;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  /* Nav links — vertical stack, grows to fill, pushes user block down */
  .navbar-links {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    padding: 12px 8px;
  }
  .navbar-link {
    display: flex;
    align-items: center;
    height: auto;
    padding: 10px 14px;
    font-size: 13px;
    color: #c5d4e3;
    cursor: pointer;
    border-radius: var(--radius-md);
    border-bottom: none;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .navbar-link:hover:not(.active) {
    background: var(--navy-800);
    color: var(--white);
  }
  .navbar-link.active {
    background: var(--navy-700);
    color: var(--white);
    font-weight: 500;
    box-shadow: inset 3px 0 0 rgba(255,255,255,0.6);
  }
  /* User block — pinned to bottom */
  .navbar-user {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    color: #c5d4e3;
  }
  .navbar-user-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--navy-700);
    color: var(--white);
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbar-user-name {
    font-size: 12px;
    color: var(--white);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .navbar-signout {
    font-size: 11px;
    color: #8ba3bc;
    text-decoration: none;
    display: block;
    padding-left: 42px; /* aligned under username (avatar 32 + gap 10) */
    transition: color 0.15s;
  }
  .navbar-signout:hover { color: var(--white); text-decoration: none; }


  /* ─── CARDS ─────────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
  }
  .card-title { font-size: 16px; font-weight: 600; }


  /* ─── STAT CARDS (dashboard summary) ────────────────────── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-left: 3px solid var(--gray-200); /* colored per variant below */
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
  }
  /* Colored left border keyed to the number variant (:has() — safe in Chrome/Edge) */
  .stat-card:has(.stat-number.blue)  { border-left-color: var(--blue-text); }
  .stat-card:has(.stat-number.green) { border-left-color: var(--green-text); }
  .stat-card:has(.stat-number.red)   { border-left-color: var(--red-text); }
  .stat-card:has(.stat-number.amber) { border-left-color: var(--amber-text); }
  .stat-card.clickable {
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .stat-card.clickable:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .stat-card.active {
    box-shadow: inset 0 0 0 2px var(--navy-700);
  }
  .stat-number {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--gray-900);
    font-variant-numeric: tabular-nums; /* counts don't jitter when filters change */
  }
  .stat-number.blue   { color: var(--blue-text); }
  .stat-number.amber  { color: var(--amber-text); }
  .stat-number.green  { color: var(--green-text); }
  .stat-number.red    { color: var(--red-text); }
  .stat-label {
    /* Overline tier — 11/600/uppercase/0.06em (shared with .form-section-title,
       .filter-label, .data-table th) */
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }


  /* ─── BUTTONS ───────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Keyboard-only focus ring (mouse clicks don't trigger :focus-visible) */
  .btn:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }
  /* Subtle physical press on click */
  .btn:active:not(:disabled) { transform: translateY(0.5px); }

  .btn-primary {
    background: var(--navy-900);
    color: var(--white);
    border-color: var(--navy-900);
  }
  .btn-primary:hover:not(:disabled) { background: var(--navy-800); }

  .btn-secondary {
    background: var(--white);
    color: var(--gray-900);
    border-color: var(--gray-200);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-100); }

  .btn-success {
    background: var(--navy-900);
    color: var(--white);
    border-color: var(--navy-900);
  }
  .btn-success:hover:not(:disabled) { background: var(--navy-800); }

  .btn-warning {
    background: var(--white);
    color: var(--amber-text);
    border-color: var(--amber-text);
  }
  .btn-warning:hover:not(:disabled) { background: var(--amber-bg); }

  .btn-danger {
    background: var(--white);
    color: var(--red-text);
    border-color: var(--red-text);
  }
  .btn-danger:hover:not(:disabled) { background: var(--red-bg); }


  /* ─── BADGES (status pills) ─────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  .badge-pending  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-approved { background: var(--green-bg);  color: var(--green-text); }
  .badge-declined { background: var(--red-bg);    color: var(--red-text); }
  .badge-returned { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-syncing  { background: var(--purple-bg); color: var(--purple-text); }
  /* #10 — contract end date lapsed. Red = urgent; rendered NEXT TO the status
     badge, never instead of it (so a Declined+expired row shows two red pills —
     acceptable; the labels read differently). */
  .badge-expired  { background: var(--red-bg);    color: var(--red-text); }


  /* ─── TABLES ────────────────────────────────────────────── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    /* Overline tier */
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px;
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
  }
  .data-table tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--gray-200);
    color: var(--gray-900);
  }
  .data-table tbody tr:hover { background: var(--gray-50); cursor: pointer; }
  .data-table tbody tr:last-child td { border-bottom: none; }


  /* ─── FORMS ─────────────────────────────────────────────── */
  .form-section {
    margin-bottom: 24px;
  }
  .form-section-title {
    /* Overline tier */
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gray-200);
  }
  .form-row {
    margin-bottom: 16px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    color: var(--gray-600);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-label .required { color: var(--red-text); margin-left: 2px; }
  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    color: var(--gray-900);
    background: var(--white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-input:focus,
  .form-select:focus,
  .form-textarea:focus {
    outline: none;
    border-color: var(--navy-700);
    box-shadow: 0 0 0 3px rgba(19, 69, 120, 0.1);
  }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-200);
  }


  /* ─── ATTACHMENT UPLOAD (Phase 8 — new-request form) ─────── */

  /* Row for the "Add file" button + size-limit note */
  .attachment-add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  /* Label wrapping the hidden <input type=file> — acts as a button */
  label.file-input-label {
    cursor: pointer;
  }

  /* One selected-file row: filename | description input | remove button */
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-200);
  }
  .attachment-item:last-child { border-bottom: none; }

  /* Filename — fixed width, truncates with ellipsis */
  .attachment-item-name {
    flex: 0 0 180px;
    min-width: 0;
    font-size: 13px;
    color: var(--gray-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Description input — fills remaining space */
  .attachment-item-desc {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    padding: 5px 10px;
  }

  /* Remove (×) button */
  .attachment-item-remove {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--gray-400);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    transition: color 0.1s ease, background 0.1s ease;
  }
  .attachment-item-remove:hover {
    color: var(--red-text);
    background: var(--red-bg);
  }


  /* ─── ATTACHMENT VIEW (Phase 8 — detail/review read view) ── */

  /* One attachment row: [info column: filename + desc] | View button */
  .attachment-view-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-200);
  }
  .attachment-view-row:last-child { border-bottom: none; }

  /* Info column — takes remaining space, clips long filenames */
  .attachment-view-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Filename — primary label */
  .attachment-view-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Description — always visible, muted, below the filename */
  .attachment-view-desc {
    font-size: 12px;
    color: var(--gray-600);
  }

  /* Small text-button for View */
  .attachment-link-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy-700);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: color 0.1s ease, background 0.1s ease;
  }
  .attachment-link-btn:hover {
    color: var(--navy-900);
    background: var(--navy-100);
  }

  /* Attachment cycle grouping (#6) — "Current submission" vs "Previous versions".
     Only rendered when a request has been resubmitted (more than one cycle). */
  .attachment-group + .attachment-group { margin-top: 14px; }
  .attachment-group-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-900);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 6px 0;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 2px;
  }
  /* "Previous versions" header is de-emphasized vs the current submission. */
  .attachment-group-previous .attachment-group-label { color: var(--gray-600); }
  /* Per-cycle sub-label inside "Previous versions" (Original / Resubmit #N). */
  .attachment-subgroup-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-400);
    padding: 8px 0 2px;
  }
  .attachment-group-empty {
    font-size: 12px;
    padding: 8px 0;
  }


  /* ─── DETAIL ROWS (request detail page) ─────────────────── */
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-200);
    gap: 16px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key {
    font-size: 12px;
    color: var(--gray-600);
    min-width: 160px;
  }
  .detail-value {
    font-size: 13px;
    color: var(--gray-900);
    text-align: right;
    flex: 1;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0; /* flex child must declare this to allow shrinking */
  }


  /* ─── PROGRESS STEPS (approval workflow indicator) ──────── */
  .progress-steps {
    display: flex;
    align-items: center;
    margin: 20px 0;
    gap: 6px;
  }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-400);
    flex-shrink: 0;
  }
  .step-dot.done {
    background: var(--navy-900);
    border-color: var(--navy-900);
    color: var(--white);
  }
  .step-dot.active {
