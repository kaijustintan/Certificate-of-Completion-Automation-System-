<!--
  ════════════════════════════════════════════════════════════
  FILE: Stylesheet.html — Global CSS for the entire portal
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Lahat ng kulay, spacing, card styles, buttons, at layout rules
  ng portal ay narito. Isang lugar lang para sa lahat ng CSS para
  consistent ang design sa bawat page. Huwag maglagay ng CSS sa
  ibang files — palaging dito.

  TECHNICAL:
  Included as a <?!= include('frontend/Stylesheet'); ?> scriptlet
  in Index.html. Defines the :root design-token variables consumed
  by all other CSS rules. One file = one global stylesheet.

  ────────────────────────────────────────────────────────────
  SECTIONS (search by comment header)
  ────────────────────────────────────────────────────────────
  RESET                  box-sizing, body defaults, font-smoothing
  DESIGN TOKENS (:root)  all color + layout custom properties
  TYPOGRAPHY             h1/h2/h3, p, a, .text-muted/.text-small
  LAYOUT — APP SHELL     .app-shell (flex-row), .app-main (1280px max), .page-header
  SIDEBAR                .sidebar + .navbar-brand/links/user (was top navbar)
  CARDS                  .card, .card-header, .card-title
  STAT CARDS             .stat-grid, .stat-card + clickable/active variants,
                         .stat-number (+ .blue/.green/.red/.amber), .stat-label
  BUTTONS                .btn + 5 variants (primary/secondary/success/warning/danger)
  BADGES                 .badge + 5 status variants
  TABLES                 .data-table (header/body/hover)
  FORMS                  .form-section, .form-grid, .form-label, .form-input/select/textarea, .form-actions
  DETAIL ROWS            .detail-row, .detail-key, .detail-value
  PROGRESS STEPS         .progress-steps, .step-dot (done/active/declined), .step-line
  RESUBMIT BANNER        .resubmit-banner
  ACTION BAR             .action-item, .form-actions
  FILTER BAR             .filter-bar, .filter-group, .filter-label, .filter-select
  TWO-COLUMN LAYOUT      .detail-layout, .detail-main, .detail-rail, .action-card overrides
  LOADING OVERLAY        .loading-overlay, .loading-box, .loading-msg
  TOASTS                 .toast + .success/.error
  CONFIRM MODAL          .modal-overlay, .modal, .modal-title/.message/.actions
  MIGA WIDGET            .miga-widget, .miga-img, .miga-bubble-*
  EMPTY STATE            .empty-state
  LOGIN SPLASH           .login-shell, .login-card
  TAB ROW                .tab-row, .tab, .tab-count (kept for reference)
  UTILITIES              .hidden, .flex, .gap-sm/md, .mt/mb-sm/md, .text-right, .required
  RESPONSIVE             @media (max-width:1024px), (max-width:768px), (max-width:640px)
-->
<style>
  /* ============================================================
     STYLESHEET.HTML
     Global styles for the entire Megaworld E-Certificate Portal.
     Organized by section — search by comment header.
     ============================================================ */


  /* ─── RESET ─────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #1a1a1a;
    background: #f7f9fc;
    -webkit-font-smoothing: antialiased;
  }


  /* ─── DESIGN TOKENS ─────────────────────────────────────── */
  :root {
    /* Primary brand colors */
    --navy-900: #0a2744;   /* primary dark navy */
    --navy-800: #0d3460;
    --navy-700: #134578;
    --navy-100: #e6f1fb;   /* light navy tint */

    /* Neutrals */
    --white:    #ffffff;
    --gray-50:  #f7f9fc;   /* page background */
    --gray-100: #f1f4f8;   /* card background secondary */
    --gray-200: #e5eaf0;   /* borders */
    --gray-400: #9aa5b1;   /* muted text */
    --gray-600: #5a6470;   /* secondary text */
    --gray-900: #1a1a1a;   /* primary text */

    /* Semantic colors */
    --blue-bg:    #e6f1fb;
    --blue-text:  #185fa5;
    --green-bg:   #eaf3de;
    --green-text: #3b6d11;
    --amber-bg:   #faeeda;
    --amber-text: #ba7517;
    --red-bg:     #fcebeb;
    --red-text:   #a32d2d;
    --purple-bg:  #eeedfe;
    --purple-text: #534ab7;

    /* Layout */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(10, 39, 68, 0.04);
    --shadow-md: 0 2px 8px rgba(10, 39, 68, 0.08);
  }


  /* ─── TYPOGRAPHY ────────────────────────────────────────── */
  h1 { font-size: 28px; font-weight: 600; color: var(--gray-900); }
  h2 { font-size: 18px; font-weight: 500; color: var(--gray-900); }
  h3 { font-size: 16px; font-weight: 500; color: var(--gray-900); }
  p  { color: var(--gray-900); }
  a  { color: var(--blue-text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .text-muted { color: var(--gray-600); }
  .text-small { font-size: 12px; }
  .text-tiny  { font-size: 11px; }


  /* ─── LAYOUT — APP SHELL ────────────────────────────────── */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: row; /* sidebar + content side by side */
  }

  .app-main {
    flex: 1;
    min-width: 0;         /* prevent flex-row table/grid overflow */
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 36px 64px;
  }

  .page-header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-title { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .page-subtitle { font-size: 13px; color: var(--gray-600); }


  /* ─── SIDEBAR (was NAVBAR — same inner IDs/classes, no JS change needed) ─ */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--navy-900);
    color: var(--white);
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 100;
  }
  .navbar-brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--white);
    cursor: pointer;
    padding: 24px 20px 20px;
    line-height: 1.4;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  /* Nav links — vertical stack, grows to fill, pushes user block down */
  .navbar-links {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    padding: 12px 8px;
  }
  .navbar-link {
    display: flex;
    align-items: center;
    height: auto;
    padding: 10px 14px;
    font-size: 13px;
    color: #c5d4e3;
    cursor: pointer;
    border-radius: var(--radius-md);
    border-bottom: none;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .navbar-link:hover:not(.active) {
    background: var(--navy-800);
    color: var(--white);
  }
  .navbar-link.active {
    background: var(--navy-700);
    color: var(--white);
    font-weight: 500;
    box-shadow: inset 3px 0 0 rgba(255,255,255,0.6);
  }
  /* User block — pinned to bottom */
  .navbar-user {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    color: #c5d4e3;
  }
  .navbar-user-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--navy-700);
    color: var(--white);
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbar-user-name {
    font-size: 12px;
    color: var(--white);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .navbar-signout {
    font-size: 11px;
    color: #8ba3bc;
    text-decoration: none;
    display: block;
    padding-left: 42px; /* aligned under username (avatar 32 + gap 10) */
    transition: color 0.15s;
  }
  .navbar-signout:hover { color: var(--white); text-decoration: none; }


  /* ─── CARDS ─────────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
  }
  .card-title { font-size: 16px; font-weight: 600; }


  /* ─── STAT CARDS (dashboard summary) ────────────────────── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-left: 3px solid var(--gray-200); /* colored per variant below */
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
  }
  /* Colored left border keyed to the number variant (:has() — safe in Chrome/Edge) */
  .stat-card:has(.stat-number.blue)  { border-left-color: var(--blue-text); }
  .stat-card:has(.stat-number.green) { border-left-color: var(--green-text); }
  .stat-card:has(.stat-number.red)   { border-left-color: var(--red-text); }
  .stat-card:has(.stat-number.amber) { border-left-color: var(--amber-text); }
  .stat-card.clickable {
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .stat-card.clickable:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .stat-card.active {
    box-shadow: inset 0 0 0 2px var(--navy-700);
  }
  .stat-number {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--gray-900);
  }
  .stat-number.blue   { color: var(--blue-text); }
  .stat-number.amber  { color: var(--amber-text); }
  .stat-number.green  { color: var(--green-text); }
  .stat-number.red    { color: var(--red-text); }
  .stat-label {
    font-size: 11px;
    color: var(--gray-600);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }


  /* ─── BUTTONS ───────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary {
    background: var(--navy-900);
    color: var(--white);
    border-color: var(--navy-900);
  }
  .btn-primary:hover:not(:disabled) { background: var(--navy-800); }

  .btn-secondary {
    background: var(--white);
    color: var(--gray-900);
    border-color: var(--gray-200);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-100); }

  .btn-success {
    background: var(--navy-900);
    color: var(--white);
    border-color: var(--navy-900);
  }
  .btn-success:hover:not(:disabled) { background: var(--navy-800); }

  .btn-warning {
    background: var(--white);
    color: var(--amber-text);
    border-color: var(--amber-text);
  }
  .btn-warning:hover:not(:disabled) { background: var(--amber-bg); }

  .btn-danger {
    background: var(--white);
    color: var(--red-text);
    border-color: var(--red-text);
  }
  .btn-danger:hover:not(:disabled) { background: var(--red-bg); }


  /* ─── BADGES (status pills) ─────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  .badge-pending  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-approved { background: var(--green-bg);  color: var(--green-text); }
  .badge-declined { background: var(--red-bg);    color: var(--red-text); }
  .badge-returned { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-syncing  { background: var(--purple-bg); color: var(--purple-text); }


  /* ─── TABLES ────────────────────────────────────────────── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 10px 12px;
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
  }
  .data-table tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--gray-200);
    color: var(--gray-900);
  }
  .data-table tbody tr:hover { background: var(--gray-50); cursor: pointer; }
  .data-table tbody tr:last-child td { border-bottom: none; }


  /* ─── FORMS ─────────────────────────────────────────────── */
  .form-section {
    margin-bottom: 24px;
  }
  .form-section-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gray-200);
  }
  .form-row {
    margin-bottom: 14px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    color: var(--gray-600);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-label .required { color: var(--red-text); margin-left: 2px; }
  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    color: var(--gray-900);
    background: var(--white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-input:focus,
  .form-select:focus,
  .form-textarea:focus {
    outline: none;
    border-color: var(--navy-700);
    box-shadow: 0 0 0 3px rgba(19, 69, 120, 0.1);
  }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-200);
  }


  /* ─── DETAIL ROWS (request detail page) ─────────────────── */
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-200);
    gap: 16px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key {
    font-size: 12px;
    color: var(--gray-600);
    min-width: 160px;
  }
  .detail-value {
    font-size: 13px;
    color: var(--gray-900);
    text-align: right;
    flex: 1;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0; /* flex child must declare this to allow shrinking */
  }


  /* ─── PROGRESS STEPS (approval workflow indicator) ──────── */
  .progress-steps {
    display: flex;
    align-items: center;
    margin: 20px 0;
    gap: 6px;
  }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-400);
    flex-shrink: 0;
  }
  .step-dot.done {
    background: var(--navy-900);
    border-color: var(--navy-900);
    color: var(--white);
  }
  .step-dot.active {
    background: var(--blue-bg);
    border-color: var(--blue-text);
    color: var(--blue-text);
  }
  .step-dot.declined {
    background: var(--red-bg);
    border-color: var(--red-text);
    color: var(--red-text);
  }
  .step-line {
    flex: 1;
    height: 2px;
    background: var(--gray-200);
  }
  .step-line.done { background: var(--navy-900); }


  /* ─── RESUBMIT BANNER ───────────────────────────────────── */
  .resubmit-banner {
    background: var(--amber-bg);
    color: var(--amber-text);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    margin-bottom: 16px;
  }


  /* ─── ACTION ITEM (button + helper caption column) ──────── */
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }


  /* ─── TABS ──────────────────────────────────────────────── */
  .tab-row {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 18px;
    font-size: 13px;
    color: var(--gray-600);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab.active {
    color: var(--navy-900);
    border-bottom-color: var(--navy-900);
    font-weight: 500;
  }
  .tab:hover:not(.active) { color: var(--gray-900); }
  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin-left: 6px;
    border-radius: 9px;
    background: var(--gray-200);
    color: var(--gray-600);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
  }
  .tab.active .tab-count {
    background: var(--navy-100);
    color: var(--navy-900);
  }


  /* ─── FILTER BAR ────────────────────────────────────────── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 16px;
    align-items: flex-end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }
  .filter-select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    min-width: 140px;
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--primary);
  }


  /* ─── EMPTY STATE ───────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--gray-600);
  }
  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .empty-state-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-900);
    margin-bottom: 4px;
  }


  /* ─── LOADING STATE ─────────────────────────────────────── */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--gray-600);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--gray-200);
    border-top-color: var(--navy-900);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }


  /* ─── TWO-COLUMN DETAIL LAYOUT ─────────────────────────── */
  /* Used by ReviewDetail and RequestDetail for main+rail layout */
  .detail-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    align-items: start; /* required for sticky rail to work */
  }
  /* Grid children must have min-width:0 or content wider than the track
     will overflow the grid and cause a horizontal scrollbar */
  .detail-main,
  .detail-rail {
    min-width: 0;
  }
  .detail-rail {
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* Inside the narrow rail, switch detail-rows to a stacked layout
     (label on top, value below) so long emails don't overflow or overlap */
  .detail-rail .detail-row {
    flex-direction: column;
    gap: 2px;
  }
  .detail-rail .detail-key {
    min-width: 0;
    font-size: 11px;
  }
  .detail-rail .detail-value {
    text-align: left;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* Action buttons in the sticky rail: stack vertically, full width */
  .action-card .form-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .action-card .form-actions .btn {
    width: 100%;
    justify-content: center;
  }
  /* Collapse to single column on narrower viewports */
  @media (max-width: 1024px) {
    .detail-layout {
      grid-template-columns: 1fr;
    }
    .detail-main,
    .detail-rail {
      min-width: 0;
    }
    .detail-rail {
      position: static;
      max-height: none;
      overflow-x: visible;
    }
    /* Restore normal row layout when stacked single-column */
    .detail-rail .detail-row {
      flex-direction: row;
      gap: 16px;
    }
    .detail-rail .detail-key { min-width: 160px; font-size: 12px; }
    .detail-rail .detail-value { text-align: right; }
  }
