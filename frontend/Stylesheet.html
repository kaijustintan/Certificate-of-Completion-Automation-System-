<!--
  ════════════════════════════════════════════════════════════
  FILE: Stylesheet.html — Global CSS for the entire portal
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Lahat ng kulay, spacing, card styles, buttons, at layout rules
  ng portal ay narito. Isang lugar lang para sa lahat ng CSS para
  consistent ang design sa bawat page. Huwag maglagay ng CSS sa
  ibang files — palaging dito.

  TECHNICAL:
  Included as a <?!= include('frontend/Stylesheet'); ?> scriptlet
  in Index.html. Defines the :root design-token variables consumed
  by all other CSS rules. One file = one global stylesheet.

  ────────────────────────────────────────────────────────────
  SECTIONS (search by comment header)
  ────────────────────────────────────────────────────────────
  RESET                  box-sizing, body defaults, font-smoothing
  DESIGN TOKENS (:root)  all color + layout custom properties
  TYPOGRAPHY             h1/h2/h3, p, a, .text-muted/.text-small
  LAYOUT — APP SHELL     .app-shell (flex-row), .app-main (1280px max), .page-header
  SIDEBAR                .sidebar + .navbar-brand/links/user (was top navbar)
  CARDS                  .card, .card-header, .card-title
  STAT CARDS             .stat-grid, .stat-card + clickable/active variants,
                         .stat-number (+ .blue/.green/.red/.amber), .stat-label
  BUTTONS                .btn + 5 variants (primary/secondary/success/warning/danger)
  BADGES                 .badge + 5 status variants
  TABLES                 .data-table (header/body/hover)
  FORMS                  .form-section, .form-grid, .form-label, .form-input/select/textarea, .form-actions
  DETAIL ROWS            .detail-row, .detail-key, .detail-value
  PROGRESS STEPS         .progress-steps, .step-dot (done/active/declined), .step-line
  REQUEST TIMELINE       .timeline, .timeline-cycle/-item/-dot/-action/-meta/-remark
  RESUBMIT BANNER        .resubmit-banner
  ACTION BAR             .action-item, .form-actions
  FILTER BAR             .filter-bar, .filter-group, .filter-label, .filter-select
  TWO-COLUMN LAYOUT      .detail-layout, .detail-main, .detail-rail, .action-card overrides
  LOADING OVERLAY        .loading-overlay, .loading-box, .loading-msg
  TOASTS                 .toast + .success/.error
  CONFIRM MODAL          .modal-overlay, .modal, .modal-title/.message/.actions
  MIGA WIDGET            .miga-widget, .miga-img, .miga-bubble-*
  EMPTY STATE            .empty-state
  LOGIN SPLASH           .login-shell, .login-card
  TAB ROW                .tab-row, .tab, .tab-count (used by ApproverDashboard view switch)
  ADMIN CONSOLE          .admin-groups-head, .admin-group-card/-title/-name/-meta/-actions,
                         .admin-inline-form, .admin-warn, .admin-chain-editor,
                         .chain-slot-row, .chain-slot-seq
  UTILITIES              .hidden, .flex, .gap-sm/md, .mt/mb-sm/md, .text-right, .required
  RESPONSIVE             @media (max-width:1024px), (max-width:768px), (max-width:640px)
-->
<style>
  /* ============================================================
     STYLESHEET.HTML
     Global styles for the entire Megaworld E-Certificate Portal.
     Organized by section — search by comment header.
     ============================================================ */


  /* ─── RESET ─────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #1a1a1a;
    background: #f7f9fc;
    -webkit-font-smoothing: antialiased;
  }


  /* ─── DESIGN TOKENS ─────────────────────────────────────── */
  :root {
    /* Primary brand colors */
    --navy-900: #0a2744;   /* primary dark navy */
    --navy-800: #0d3460;
    --navy-700: #134578;
    --navy-100: #e6f1fb;   /* light navy tint */

    /* Neutrals */
    --white:    #ffffff;
    --gray-50:  #f7f9fc;   /* page background */
    --gray-100: #f1f4f8;   /* card background secondary */
    --gray-200: #e5eaf0;   /* borders */
    --gray-400: #9aa5b1;   /* muted text */
    --gray-600: #5a6470;   /* secondary text */
    --gray-900: #1a1a1a;   /* primary text */

    /* Semantic colors */
    --blue-bg:    #e6f1fb;
    --blue-text:  #185fa5;
    --green-bg:   #eaf3de;
    --green-text: #3b6d11;
    --amber-bg:   #faeeda;
    --amber-text: #8a5510;
    --red-bg:     #fcebeb;
    --red-text:   #a32d2d;
    --purple-bg:  #eeedfe;
    --purple-text: #534ab7;

    /* Layout */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(10, 39, 68, 0.04);
    --shadow-md: 0 2px 8px rgba(10, 39, 68, 0.08);
    --shadow-lg: 0 8px 24px rgba(10, 39, 68, 0.12);

    /* Semantic aliases — role-named tokens over the raw ramps above.
       Several rules (.filter-*, .modal-*) already referenced these names
       while they were undefined (silent browser-default fallback); defining
       them here fixes those rules with zero selector rewrites. Prefer these
       aliases in new CSS so a future re-theme touches only this block. */
    --bg:             var(--gray-50);    /* page background */
    --surface:        var(--white);      /* cards */
    --border:         var(--gray-200);
    --text-primary:   var(--gray-900);
    --text-secondary: var(--gray-600);
    --text-muted:     var(--gray-400);
    --primary:        var(--navy-900);
    --accent:         var(--blue-text);  /* links + active states */
    --blue-accent:    #2563eb;           /* brighter interactive accent (buttons, active rings) */
    --blue-accent-700:#1d4ed8;           /* its hover/darker step */
    --radius:         var(--radius-md);
    --focus-ring:     0 0 0 3px rgba(24, 95, 165, 0.25);

    /* Motion */
    --ease-out: cubic-bezier(0.2, 0.6, 0.2, 1);
  }


  /* ─── TYPOGRAPHY ────────────────────────────────────────── */
  h1 { font-size: 28px; font-weight: 600; color: var(--gray-900); }
  h2 { font-size: 18px; font-weight: 500; color: var(--gray-900); }
  h3 { font-size: 16px; font-weight: 500; color: var(--gray-900); }
  p  { color: var(--gray-900); }
  a  { color: var(--blue-text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .text-muted { color: var(--gray-600); }
  .text-small { font-size: 12px; }
  .text-tiny  { font-size: 11px; }


  /* ─── LAYOUT — APP SHELL ────────────────────────────────── */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: row; /* sidebar + content side by side */
  }

  .app-main {
    flex: 1;
    min-width: 0;         /* prevent flex-row table/grid overflow */
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 32px 64px;
  }

  .page-header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Display tier — Inter wants slight negative tracking at 20px+ */
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 4px; }
  .page-subtitle { font-size: 13px; color: var(--gray-600); }


  /* ─── SIDEBAR (was NAVBAR — same inner IDs/classes, no JS change needed) ─ */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--navy-900);
    color: var(--white);
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 100;
  }
  .navbar-brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--white);
    cursor: pointer;
    padding: 24px 20px 20px;
    line-height: 1.4;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  /* Nav links — vertical stack, grows to fill, pushes user block down */
  .navbar-links {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    padding: 12px 8px;
  }
  .navbar-link {
    display: flex;
    align-items: center;
    height: auto;
    padding: 10px 14px;
    font-size: 13px;
    color: #c5d4e3;
    cursor: pointer;
    border-radius: var(--radius-md);
    border-bottom: none;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .navbar-link:hover:not(.active) {
    background: var(--navy-800);
    color: var(--white);
  }
  .navbar-link.active {
    background: var(--navy-700);
    color: var(--white);
    font-weight: 500;
    box-shadow: inset 3px 0 0 rgba(255,255,255,0.6);
  }
  .navbar-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  /* User block — pinned to bottom */
  .navbar-user {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    color: #c5d4e3;
  }
  .navbar-user-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--navy-700);
    color: var(--white);
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbar-user-name {
    font-size: 12px;
    color: var(--white);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .navbar-signout {
    font-size: 11px;
    color: #8ba3bc;
    text-decoration: none;
    display: block;
    padding-left: 42px; /* aligned under username (avatar 32 + gap 10) */
    transition: color 0.15s;
  }
  .navbar-signout:hover { color: var(--white); text-decoration: none; }


  /* ─── CARDS ─────────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
  }
  .card-title { font-size: 16px; font-weight: 600; }


  /* ─── STAT CARDS (dashboard summary) ────────────────────── */
  /* Icon-tile layout: colored tile (left) + value/label/delta (right).
     Color now lives in the tile, not a left border. The data-filter /
     data-statkey hooks + .active / .clickable behavior are unchanged. */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 18px;
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--gray-400);
  }
  .stat-card.clickable:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .stat-card.active {
    border-color: var(--blue-accent);
    box-shadow: inset 0 0 0 1px var(--blue-accent);
  }
  /* Colored icon tile — tinted bg + matching icon color per tone */
  .stat-icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-icon-blue  { background: var(--blue-bg);   color: var(--blue-text); }
  .stat-icon-green { background: var(--green-bg);  color: var(--green-text); }
  .stat-icon-red   { background: var(--red-bg);    color: var(--red-text); }
  .stat-icon-amber { background: var(--amber-bg);  color: var(--amber-text); }
  .stat-icon-navy  { background: var(--navy-100);  color: var(--navy-700); }
  .stat-body { min-width: 0; flex: 1; }
  .stat-label {
    /* Overline tier */
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stat-number {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text-primary);
    margin-top: 2px;
    font-variant-numeric: tabular-nums; /* counts don't jitter when filters change */
  }
  /* Delta line — direction sets the color (up=green, down=red, flat=muted) */
  .stat-delta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .stat-delta-up   { color: var(--green-text); }
  .stat-delta-down { color: var(--red-text); }
  .stat-delta-flat { color: var(--text-muted); }


  /* ─── BUTTONS ───────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 34px;        /* uniform control height across all variants */
    padding: 0 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Keyboard-only focus ring (mouse clicks don't trigger :focus-visible) */
  .btn:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }
  /* Subtle physical press on click */
  .btn:active:not(:disabled) { transform: translateY(0.5px); }

  /* Primary = the blue interactive accent (the SaaS call-to-action color;
     navy stays the chrome/brand color on the sidebar + headers). */
  .btn-primary {
    background: var(--blue-accent);
    color: var(--white);
    border-color: var(--blue-accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--blue-accent-700); border-color: var(--blue-accent-700); }

  .btn-secondary {
    background: var(--white);
    color: var(--gray-900);
    border-color: var(--gray-200);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-100); }

  /* Solid green — Approve must read semantically distinct from generic
     navy primary actions. Hover darkens via brightness (no new hex). */
  .btn-success {
    background: var(--green-text);
    color: var(--white);
    border-color: var(--green-text);
  }
  .btn-success:hover:not(:disabled) { filter: brightness(0.92); }

  .btn-warning {
    background: var(--white);
    color: var(--amber-text);
    border-color: var(--amber-text);
  }
  .btn-warning:hover:not(:disabled) { background: var(--amber-bg); }

  .btn-danger {
    background: var(--white);
    color: var(--red-text);
    border-color: var(--red-text);
  }
  .btn-danger:hover:not(:disabled) { background: var(--red-bg); }


  /* ─── BADGES (status pills) ─────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid transparent; /* outline variants override; keeps heights equal */
  }
  /* Leading status dot — inherits the pill's text color via currentColor */
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .badge-pending  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-approved { background: var(--green-bg);  color: var(--green-text); }
  .badge-declined { background: var(--red-bg);    color: var(--red-text); }
  .badge-returned { background: var(--amber-bg);  color: var(--amber-text); }
  /* #10 — contract end date lapsed. Outline style (not the solid red tint) so it
     reads as a MODIFIER chip next to the status badge, never as a status itself —
     and no longer visually collides with the solid Declined pill. */
  .badge-expired {
    background: transparent;
    color: var(--red-text);
    border-color: var(--red-text);
  }


  /* ─── TABLES ────────────────────────────────────────────── */
  /* Wraps a full data-table so it scrolls horizontally inside its own box on
     narrow viewports instead of forcing the whole page to scroll sideways. */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    /* Overline tier */
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px;
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
  }
  .data-table tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--gray-200);
    color: var(--gray-900);
  }
  .data-table tbody tr { transition: background 0.1s ease; }
  .data-table tbody tr:hover { background: var(--gray-50); cursor: pointer; }
  .data-table tbody tr:last-child td { border-bottom: none; }
  /* Last column is always the Filed date on every request table —
     right-align + tabular figures so dates read as a column of numbers */
  .data-table th:last-child,
  .data-table td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  /* Long free-text cells (project titles, requestor emails) — clip with
     ellipsis; the full value lives in the cell's title attribute */
  .data-table td.cell-clip {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }


  /* ─── FORMS ─────────────────────────────────────────────── */
  .form-section {
    margin-bottom: 24px;
  }
  .form-section-title {
    /* Overline tier */
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gray-200);
  }
  .form-row {
    margin-bottom: 16px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    color: var(--gray-600);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-label .required { color: var(--red-text); margin-left: 2px; }
  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    color: var(--gray-900);
    background: var(--white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-input:focus,
  .form-select:focus,
  .form-textarea:focus {
    outline: none;
    border-color: var(--navy-700);
    box-shadow: var(--focus-ring);
  }
  .form-textarea { min-height: 80px; resize: vertical; }
  /* Inline validation: a field flagged by the submit handler shows a red border. */
  .form-input.input-error,
  .form-select.input-error,
  .form-textarea.input-error {
    border-color: var(--red-text);
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-200);
  }


  /* ─── ATTACHMENT UPLOAD (Phase 8 — new-request form) ─────── */

  /* Row for the "Add file" button + size-limit note */
  .attachment-add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  /* Label wrapping the hidden <input type=file> — acts as a button */
  label.file-input-label {
    cursor: pointer;
  }

  /* One selected-file row: filename | description input | remove button */
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-200);
  }
  .attachment-item:last-child { border-bottom: none; }

  /* Filename — flexes to share the row, truncates with ellipsis */
  .attachment-item-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 13px;
    color: var(--gray-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Description input — fills remaining space */
  .attachment-item-desc {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    padding: 5px 10px;
  }

  /* Remove (×) button */
  .attachment-item-remove {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--gray-400);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    transition: color 0.1s ease, background 0.1s ease;
  }
  .attachment-item-remove:hover {
    color: var(--red-text);
    background: var(--red-bg);
  }


  /* ─── ATTACHMENT VIEW (Phase 8 — detail/review read view) ── */

  /* One attachment row: [info column: filename + desc] | View button */
  .attachment-view-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-200);
  }
  .attachment-view-row:last-child { border-bottom: none; }

  /* Info column — takes remaining space, clips long filenames */
  .attachment-view-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Filename — primary label */
  .attachment-view-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Description — always visible, muted, below the filename */
  .attachment-view-desc {
    font-size: 12px;
    color: var(--gray-600);
  }

  /* Small text-button for View */
  .attachment-link-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy-700);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: color 0.1s ease, background 0.1s ease;
  }
  .attachment-link-btn:hover {
    color: var(--navy-900);
    background: var(--navy-100);
  }

  /* Attachment cycle grouping (#6) — "Current submission" vs "Previous versions".
     Only rendered when a request has been resubmitted (more than one cycle). */
  .attachment-group + .attachment-group { margin-top: 14px; }
  .attachment-group-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-900);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 6px 0;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 2px;
  }
  /* "Previous versions" header is de-emphasized vs the current submission. */
  .attachment-group-previous .attachment-group-label { color: var(--gray-600); }
  /* Per-cycle sub-label inside "Previous versions" (Original / Resubmit #N). */
  .attachment-subgroup-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-400);
    padding: 8px 0 2px;
  }
  .attachment-group-empty {
    font-size: 12px;
    padding: 8px 0;
  }


  /* ─── DETAIL ROWS (request detail page) ─────────────────── */
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-200);
    gap: 16px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key {
    font-size: 12px;
    color: var(--gray-600);
    min-width: 160px;
  }
  .detail-value {
    font-size: 13px;
    color: var(--gray-900);
    text-align: right;
    flex: 1;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0; /* flex child must declare this to allow shrinking */
  }

  /* Field grid inside .detail-main cards — cells are stacked label-over-value
     (reads like Vercel's settings panels); two columns on desktop so the
     12-row info card doesn't waste half the card width. */
  .detail-grid .detail-row {
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }
  .detail-grid .detail-key   { min-width: 0; }
  .detail-grid .detail-value { text-align: left; }
  @media (min-width: 1024px) {
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 24px;
    }
    .detail-grid .detail-row { min-width: 0; } /* grid child overflow guard */
    .detail-grid .detail-row--full { grid-column: 1 / -1; }
  }


  /* ─── PROGRESS STEPS (approval workflow indicator) ──────── */
  .progress-steps {
    display: flex;
    align-items: center;
    margin: 20px 0;
    gap: 6px;
  }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--gray-400);
    flex-shrink: 0;
  }
  .step-dot.done {
    background: var(--navy-900);
    border-color: var(--navy-900);
    color: var(--white);
  }
  .step-dot.active {
    background: var(--blue-bg);
    border-color: var(--blue-text);
    color: var(--blue-text);
    animation: stepPulse 2s ease-in-out 2; /* breathes twice, then settles */
  }
  .step-dot.declined {
    background: var(--red-bg);
    border-color: var(--red-text);
    color: var(--red-text);
  }
  .step-line {
    flex: 1;
    height: 2px;
    background: var(--gray-200);
    transition: background 240ms var(--ease-out);
  }
  .step-line.done { background: var(--navy-900); }


  /* ─── REQUEST TIMELINE ──────────────────────────────────── */
  /* Vertical activity list rendered by renderTimeline() (UI.html), shown on both
     RequestDetail (requestor) and ReviewDetail (approver). The connector line is
     a border on .timeline, and each item's dot sits on top of it, so a variable
     number of entries needs no per-item height maths. */
  .timeline {
    position: relative;
    padding-left: 22px;
    border-left: 1px solid var(--border);
    margin-left: 6px;
  }
  .timeline-cycle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 16px 0 8px;
  }
  .timeline-cycle:first-child { margin-top: 0; }
  .timeline-item {
    position: relative;
    padding-bottom: 14px;
    /* Grid child guard (see the CSS notes in CLAUDE.md): long emails and long
       return reasons must wrap instead of widening the column. */
    min-width: 0;
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot {
    position: absolute;
    left: -27px;
    top: 4px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--navy-900);
    box-shadow: 0 0 0 3px var(--surface);   /* punches through the connector line */
  }
  .timeline-approved .timeline-dot { background: var(--green-text); }
  .timeline-declined .timeline-dot { background: var(--red-text); }
  .timeline-returned .timeline-dot { background: var(--amber-text); }
  .timeline-action {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .timeline-meta {
    font-size: 12px;
    color: var(--text-secondary);
    word-break: break-word;                  /* long approver emails */
  }
  .timeline-remark {
    font-size: 12px;
    color: var(--text-primary);
    background: var(--gray-100);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    margin-top: 5px;
    white-space: pre-wrap;
    word-break: break-word;
  }


  /* ─── RESUBMIT BANNER ───────────────────────────────────── */
  .resubmit-banner {
    background: var(--amber-bg);
    color: var(--amber-text);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    margin-bottom: 16px;
  }


  /* ─── RETURN FLAGS (per-item "fix this" marks) ──────────── */
  /* Picker inside the approver's return panel (ReviewDetail). */
  .flag-section { margin: 12px 0 4px; }
  .flag-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--amber-text);
    text-decoration: none;
  }
  .flag-toggle:hover { text-decoration: underline; }
  .flag-group-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gray-400);
    margin: 12px 0 4px;
  }
  .flag-item { padding: 4px 0; }
  .flag-item-label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--gray-900);
    cursor: pointer;
  }
  .flag-comment-row { margin: 6px 0 4px 22px; }
  .flag-comment { font-size: 13px; }

  /* Requestor side: highlighted field rows + the "What needs fixing" card. */
  .detail-row--flagged {
    background: var(--amber-bg);
    border-radius: var(--radius-sm);
  }
  .flag-pin {
    font-size: 12px;
    color: var(--amber-text);
    margin-top: 4px;
  }
  .flags-card-item { padding: 8px 0; border-bottom: 1px solid var(--gray-200); }
  .flags-card-item:last-child { border-bottom: none; }
  .flags-card-label {
    font-weight: 600;
    font-size: 13px;
    color: var(--gray-900);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .flags-card-label .flag-icon { color: var(--amber-text); }
  .flags-card-comment { font-size: 13px; color: var(--gray-600); margin-top: 2px; }
  .flags-card-meta { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
  .flags-card-resolved .flags-card-label { color: var(--gray-600); }
  .flags-card-resolved .flag-icon { color: var(--green-text); }


  /* ─── ACTION ITEM (button + helper caption column) ──────── */
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }


  /* ─── TABS ──────────────────────────────────────────────── */
  .tab-row {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 18px;
    font-size: 13px;
    color: var(--gray-600);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab.active {
    color: var(--navy-900);
    border-bottom-color: var(--navy-900);
    font-weight: 500;
  }
  .tab:hover:not(.active) { color: var(--gray-900); }
  .tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin-left: 6px;
    border-radius: 9px;
    background: var(--gray-200);
    color: var(--gray-600);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
  }
  .tab.active .tab-count {
    background: var(--navy-100);
    color: var(--navy-900);
  }


  /* ─── FILTER BAR ────────────────────────────────────────── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 16px;
    align-items: flex-end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-label {
    /* Overline tier */
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
  .filter-select {
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    min-width: 140px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .filter-select:hover { border-color: var(--gray-400); }
  .filter-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: var(--focus-ring);
  }


  /* ─── EMPTY STATE ───────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--gray-600);
  }
  .empty-state-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-900);
    margin-bottom: 4px;
  }


  /* ─── LOADING STATE ─────────────────────────────────────── */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--gray-600);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--gray-200);
    border-top-color: var(--navy-900);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ─── MOTION (shared keyframes) ─────────────────────────── */
  /* Page/list enter — subtle rise + fade. Re-triggered by navigateTo()
     via the .page-in class (remove → reflow → add). */
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #app.page-in { animation: pageIn 180ms var(--ease-out); }
  /* Same rise+fade for in-page list swaps (e.g. #approver-list re-render) */
  .fade-in { animation: pageIn 150ms var(--ease-out); }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.98); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  /* Breathing ring on the active approval step — 2 iterations then settles,
     enough to draw the eye without being a perpetual distraction. */
  @keyframes stepPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(24, 95, 165, 0.25); }
    50%      { box-shadow: 0 0 0 6px rgba(24, 95, 165, 0); }
  }

  /* Accessibility — kill all motion for users who asked for it */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }


  /* ─── TWO-COLUMN DETAIL LAYOUT ─────────────────────────── */
  /* Used by ReviewDetail and RequestDetail for main+rail layout */
  .detail-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    align-items: start; /* required for sticky rail to work */
  }
  /* Grid children must have min-width:0 or content wider than the track
     will overflow the grid and cause a horizontal scrollbar */
  .detail-main,
  .detail-rail {
    min-width: 0;
  }
  .detail-rail {
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* Inside the narrow rail, switch detail-rows to a stacked layout
     (label on top, value below) so long emails don't overflow or overlap */
  .detail-rail .detail-row {
    flex-direction: column;
    gap: 2px;
  }
  .detail-rail .detail-key {
    min-width: 0;
    font-size: 11px;
  }
  .detail-rail .detail-value {
    text-align: left;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* Action buttons in the sticky rail: stack vertically, full width */
  .action-card .form-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .action-card .form-actions .btn {
    width: 100%;
    justify-content: center;
  }
  /* Collapse to single column on narrower viewports */
  @media (max-width: 1024px) {
    .detail-layout {
      grid-template-columns: 1fr;
    }
    .detail-main,
    .detail-rail {
      min-width: 0;
    }
    .detail-rail {
      position: static;
      max-height: none;
      overflow-x: visible;
    }
    /* Restore normal row layout when stacked single-column */
    .detail-rail .detail-row {
      flex-direction: row;
      gap: 16px;
    }
    .detail-rail .detail-key { min-width: 160px; font-size: 12px; }
    .detail-rail .detail-value { text-align: right; }
  }


  /* ─── LOADING OVERLAY (in-flight server actions) ────────── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2500; /* above the confirm modal (2000) so it can cover one */
    /* visibility+opacity instead of display toggle so show/hide can fade —
       visibility:hidden still blocks pointer events from a hidden overlay */
    visibility: hidden;
    opacity: 0;
    transition: opacity 120ms ease-out, visibility 120ms ease-out;
  }
  .loading-overlay.show {
    visibility: visible;
    opacity: 1;
  }
  .loading-box {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .loading-box .spinner {
    margin-bottom: 0;
  }
  .loading-msg {
    font-size: 13px;
    color: var(--gray-600);
  }


  /* ─── TOASTS / NOTIFICATIONS ────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy-900);
    color: var(--white);
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.success { background: var(--green-text); }
  .toast.error   { background: var(--red-text); }


  /* ─── CONFIRM MODAL ─────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 2000;
    animation: overlayIn 120ms ease-out; /* fires on append (showConfirm) */
  }
  .modal {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    max-width: 440px;
    width: 100%;
    padding: 24px;
    animation: modalIn 150ms var(--ease-out);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .modal-message {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }


  /* ─── MIGA MASCOT WIDGET ────────────────────────────────── */
  /* Soft tinted "companion aside" — deliberately NOT a white data card,
     so it reads as the mascot's voice and not another content block. */
  .miga-widget {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    background: var(--gray-100);
    border: none;
    border-radius: var(--radius-lg);
    margin-bottom: 20px;
  }
  .miga-img {
    width: 64px;
    height: 88px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: var(--radius-md);
    /* TODO (Phase 12): interim Miga images have a dark background, so the navy
       fill doubles as a deliberate frame. When the licensed TRANSPARENT assets
       land, remove this background line — nothing else needs to change. */
    background: var(--navy-900);
  }
  .miga-bubble-name {
    /* Overline tier */
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--navy-700);
    margin-bottom: 2px;
  }
  .miga-bubble-text {
    font-size: 13px;
    color: var(--gray-900);
    line-height: 1.5;
  }


  /* ─── ADMIN CONSOLE ─────────────────────────────────────── */
  /* Group cards + the approver-chain editor on the admin page.
     Flex children carry min-width:0 so long emails can't overflow. */
  .admin-groups-head { margin-bottom: 16px; }
  .admin-group-card { margin-bottom: 16px; }
  .admin-group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .admin-group-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--navy-900);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .admin-group-meta {
    font-size: 13px;
    color: var(--gray-600);
    margin: 4px 0 12px;
  }
  .admin-group-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .admin-inline-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .admin-inline-form .form-input {
    flex: 1;
    min-width: 200px;
  }
  .admin-warn {
    font-size: 13px;
    color: var(--amber-text);
    background: var(--amber-bg);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    display: inline-block;
    margin-bottom: 8px;
  }
  .admin-chain-editor {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-200);
  }
  .chain-slot-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .chain-slot-row .form-input {
    flex: 1;
    min-width: 0;
  }
  .chain-slot-seq {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--navy-100);
    color: var(--navy-800);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  /* Two-tile admin landing — distinct "choice cards" (icon + title + desc +
     arrow), not repurposed stat cards. */
  .choice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 720px;
  }
  .choice-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .choice-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--blue-accent);
  }
  .choice-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .choice-icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .choice-icon-blue { background: var(--blue-bg);  color: var(--blue-text); }
  .choice-icon-navy { background: var(--navy-100); color: var(--navy-700); }
  .choice-body { flex: 1; min-width: 0; }
  .choice-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .choice-desc  { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .choice-arrow { flex-shrink: 0; color: var(--text-muted); transition: transform 0.15s ease; }
  .choice-card:hover .choice-arrow { color: var(--blue-accent); transform: translateX(2px); }
  /* "← Admin home" back link above each section. */
  .admin-back {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--navy-700);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .admin-back:hover { text-decoration: underline; }
  /* Soft-removed chain slots: greyed, pending until Save. */
