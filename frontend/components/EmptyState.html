<!-- EmptyState.html -->
<!--
  ════════════════════════════════════════════════════════════
  FILE: EmptyState.html  (component)
  ════════════════════════════════════════════════════════════

  LAYMAN (Tropang Ex):
  Kapag walang laman ang isang listahan (hal. walang pending requests),
  hindi lang blank na page ang nakikita — lalabas si Miga na may mensahe.
  Ginagamit din ito kapag may error sa pag-load ng page.

  TECHNICAL:
  Single render function that pairs migaImageFor (from MigaWidget) with a
  title + optional message. Accepts { title, message, emotion }.
-->


<script>
/*
  Function Name: renderEmptyState
  LAYMAN    : Gumawa ng "walang laman" na display — Miga + headline + optional
              supporting text. Para sa empty lists at unrecoverable errors.
  TECHNICAL : Uses migaImageFor(emotion) for the image. title is escaped here.
              message is inserted as RAW HTML and is NOT escaped, so the caller
              MUST escape any user-supplied text before passing it (pass only
              trusted markup or pre-escaped strings). Escaping at this sink would
              double-escape the safe HTML that current callers pass, so it stays
              the caller's responsibility.
  PARAMS    : opts — { title, message, emotion }.
              title   — headline (default 'Nothing here yet.'), escaped here.
              message — optional PRE-ESCAPED/trusted HTML string (default '').
                        The caller MUST escape any user data before passing it.
              emotion — Miga variant (default 'default').
  RETURNS   : HTML string — .empty-state div.
*/
function renderEmptyState(opts) {
  opts = opts || {};
  const title   = opts.title   || 'Nothing here yet.';
  const message = opts.message || '';
  const emotion = opts.emotion || 'default';

  return '<div class="empty-state">' +
    '<img class="miga-img" src="' + migaImageFor(emotion) + '" ' +
         'alt="Miga" style="display:block;margin:0 auto 12px;">' +
    '<div class="empty-state-title">' + escapeHtml(title) + '</div>' +
    (message ? '<div>' + message + '</div>' : '') +
  '</div>';
}
</script>
