<!-- StatusBadge.html -->
<!-- ============================================================
     StatusBadge component
     Returns an HTML snippet for a status pill.
     Status → CSS class mapping lives in JavaScript.html
     (badgeClassFor) so every consumer stays in sync.
     ============================================================ -->


<script>
function renderStatusBadge(status) {
  const cls = badgeClassFor(status);
  return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
}
</script>
