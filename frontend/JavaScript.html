<!-- JavaScript.html -->
<!-- ============================================================
     JavaScript.html — Router and runtime brain for the SPA.
     Includes all component and page partials below so their
     render functions are available globally before bootstrap runs.
     ============================================================ -->


<!-- Reusable components -->


<!-- Page renderers -->


<script>
// ============================================================
// GLOBAL STATE
// One source of truth for the active user and the current route.
// Pages read from this; the router writes to it.
// ============================================================
const state = {
  user:            null,   // { email, role } once getCurrentUser() resolves
  currentPage:     null,   // string — last page navigated to
  params:          {},     // route params, e.g. { id: 'REQ-123' }
  approverGroups:  null,   // cached list of group names for the new-request form
};


// ============================================================
// SERVER CALL HELPER
// Wraps google.script.run in a Promise so we can use async/await.
// Usage:  const user = await callServer('getCurrentUser');
// ============================================================
function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}


// ============================================================
// HTML ESCAPING
// Always run user-supplied values through this before inserting
// into innerHTML. Project titles can contain quotes / angle
// brackets that otherwise break layout.
// ============================================================
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


// ============================================================
// TOAST NOTIFICATIONS
// Auto-dismiss after 3 seconds. Types: 'success' | 'error' | ''.
// ============================================================
let toastTimer = null;
function showToast(message, type) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.className = 'toast' + (type ? ' ' + type : '');
  }, 3000);
}


// ============================================================
// CONFIRM MODAL
// Promise-based replacement for the native confirm() dialog.
// Usage:  if (!(await showConfirm({ title, message, confirmLabel, danger }))) return;
// Resolves true on confirm, false on cancel / backdrop click.
// Mounts itself onto document.body and removes itself on resolve.
// ============================================================
function showConfirm(opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-title">' + escapeHtml(opts.title || 'Please confirm') + '</div>' +
        '<div class="modal-message">' + escapeHtml(opts.message || '') + '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-secondary" data-act="cancel">' + escapeHtml(opts.cancelLabel || 'Cancel') + '</button>' +
          '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="ok">' + escapeHtml(opts.confirmLabel || 'Confirm') + '</button>' +
        '</div>' +
      '</div>';

    let settled = false;
    function close(val) {
      if (settled) return;
      settled = true;
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(val);
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      if (e.key === 'Enter')  close(true);
    }

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) { close(false); return; }
      const act = e.target.getAttribute('data-act');
      if (act === 'ok')     close(true);
      if (act === 'cancel') close(false);
    });
    document.addEventListener('keydown', onKey);

    document.body.appendChild(overlay);
  });
}


// ============================================================
// STATUS HELPERS
// Single mapping from STATUS string → semantic info.
// Pages and components read from here so we don't sprinkle
// magic strings across files.
// ============================================================
const STATUS_LABELS = {
  'Syncing Files':         { badge: 'badge-syncing',  emotion: 'pending'  },
  'Pending Approver 1':    { badge: 'badge-pending',  emotion: 'pending'  },
  'Pending Approver 2':    { badge: 'badge-pending',  emotion: 'pending'  },
  'Pending Approver 3':    { badge: 'badge-pending',  emotion: 'pending'  },
  'Fully Approved':        { badge: 'badge-approved', emotion: 'approved' },
  'Declined':              { badge: 'badge-declined', emotion: 'declined' },
  'Returned to Requestor': { badge: 'badge-returned', emotion: 'returned' },
};

function badgeClassFor(status) {
  return (STATUS_LABELS[status] && STATUS_LABELS[status].badge) || 'badge-pending';
}

function emotionFor(status) {
  return (STATUS_LABELS[status] && STATUS_LABELS[status].emotion) || 'default';
}


// ============================================================
// SORT HELPER
// Used by both dashboards. Never mutates the source array.
// dateFiled format: "MMM dd, yyyy" (e.g. "Jun 02, 2025") —
// parseable by new Date() in modern browsers.
// ============================================================
function sortRequests(requests, sortKey) {
  const arr = requests.slice();
  if (sortKey === 'newest')  return arr.sort(function (a, b) {
    const d = new Date(b.dateFiled) - new Date(a.dateFiled);
    return d !== 0 ? d : String(b.controlNumber).localeCompare(String(a.controlNumber));
  });
  if (sortKey === 'oldest')  return arr.sort(function (a, b) {
    const d = new Date(a.dateFiled) - new Date(b.dateFiled);
    return d !== 0 ? d : String(a.controlNumber).localeCompare(String(b.controlNumber));
  });
  if (sortKey === 'project') return arr.sort(function (a, b) { return String(a.projectTitle).localeCompare(String(b.projectTitle)); });
  if (sortKey === 'group')   return arr.sort(function (a, b) { return String(a.group).localeCompare(String(b.group)); });
  return arr;
}


// ============================================================
// ROUTING
// Hash format:
//   #dashboard
//   #new
//   #request/REQ-123
//   #review/REQ-123
//   #approverDashboard
// Empty hash → role-based home (resolved inside navigateTo).
// ============================================================
function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return { page: 'home', params: {} };
  const [page, ...rest] = raw.split('/');
  const params = {};
  if (rest.length > 0) params.id = rest.join('/');
  return { page, params };
}

function buildHash(page, params) {
  if (!page || page === 'home') return '#';
  if (params && params.id) return '#' + page + '/' + params.id;
  return '#' + page;
}

// Loading placeholder shown between page renders.
const LOADING_HTML =
  '<div class="loading">' +
  '<div class="spinner"></div>' +
  '<div>Loading…</div>' +
  '</div>';

// Main navigation function — every page change goes through here.
async function navigateTo(page, params) {
  params = params || {};

  // Resolve 'home' to the correct dashboard for the active role.
  if (page === 'home') {
    page = (state.user && state.user.role === 'approver')
      ? 'approverDashboard'
      : 'dashboard';
  }

  state.currentPage = page;
  state.params      = params;

  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = LOADING_HTML;

  let html = '';
  try {
    switch (page) {
      case 'login':             html = await renderLoginPage(params);             break;
      case 'dashboard':         html = await renderDashboardPage(params);         break;
      case 'new':               html = await renderNewRequestPage(params);        break;
      case 'request':           html = await renderRequestDetailPage(params);     break;
      case 'approverDashboard': html = await renderApproverDashboardPage(params); break;
      case 'review':            html = await renderReviewDetailPage(params);      break;
      default:
        html = renderEmptyState({
          title:   'Page not found',
          message: 'No page matches "' + escapeHtml(page) + '".',
          emotion: 'default',
        });
    }
  } catch (err) {
    console.error('navigateTo error:', err);
    html = renderEmptyState({
      title:   'Something went wrong',
      message: escapeHtml((err && err.message) ? err.message : 'Unknown error.'),
      emotion: 'declined',
    });
  }

  app.innerHTML = html;

  // Keep the URL in sync for back/forward and link-sharing.
  const desiredHash = buildHash(page, params);
  if (location.hash !== desiredHash && !(desiredHash === '#' && !location.hash)) {
    history.replaceState(null, '', desiredHash);
  }

  // Pages can register an afterRender_<page>(params) hook to wire up
  // event listeners (form submit, button clicks) once the DOM exists.
  const hookName = 'afterRender_' + page;
  if (typeof window[hookName] === 'function') {
    try {
      window[hookName](params);
    } catch (err) {
      console.error(hookName + ' error:', err);
    }
  }

  // Keep the active nav link in sync with wherever we just landed.
  updateNavActiveLink();
}


// Re-route on browser back/forward.
function onHashChange() {
  const { page, params } = parseHash();
  navigateTo(page, params);
}


// ============================================================
// NAVBAR HOOKS
// Navbar.html ships with hardcoded onclick="navigateTo('dashboard')".
// Override after we know the role so approvers also land on their
// pending list when they click the brand.
// ============================================================
function refreshNavbar() {
  if (!state.user) return;
  const email   = state.user.email || '';
  const display = email.split('@')[0] || 'User';
  const initial = (display.charAt(0) || '?').toUpperCase();

  const nameEl   = document.getElementById('navbar-user-name');
  const avatarEl = document.getElementById('navbar-avatar');
  if (nameEl)   nameEl.textContent = display;
  if (avatarEl) avatarEl.textContent = initial;

  const brand = document.querySelector('.navbar-brand');
  if (brand) brand.onclick = function () { navigateTo('home'); };

  const linksEl = document.getElementById('navbar-links');
  if (linksEl) {
    let html = '<span class="navbar-link" data-page="approverDashboard" onclick="navigateTo(\'approverDashboard\')">My Approvals</span>';
    if (state.user.role === 'approver') {
      html += '<span class="navbar-link" data-page="dashboard" onclick="navigateTo(\'dashboard\')">My Requests</span>';
    } else {
      html = '<span class="navbar-link" data-page="dashboard" onclick="navigateTo(\'dashboard\')">My Requests</span>';
    }
    linksEl.innerHTML = html;
  }

  updateNavActiveLink();
}

// Syncs the .active class on navbar links to the current page.
// Called after every navigateTo() so the highlight always reflects
// where the user is.
function updateNavActiveLink() {
  const links = document.querySelectorAll('.navbar-link[data-page]');
  links.forEach(function (link) {
    if (link.getAttribute('data-page') === state.currentPage) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
}


// ============================================================
// BOOTSTRAP
// Runs once on initial page load. Detects role, then routes.
// ============================================================
async function bootstrap() {
  // Mount the login splash immediately so the user sees Miga, not a blank screen.
  await navigateTo('login', {});

  try {
    const user = await callServer('getCurrentUser');
    if (!user || !user.email) {
      // Apps Script can return an empty email under certain workspace
      // permission configurations — surface the welcome/error fallback.
      window.__loginError = 'We could not detect your Google account. Please sign in to your Megaworld Google account and reload.';
      await navigateTo('login', { error: true });
      return;
    }

    state.user = user;
    refreshNavbar();

    // Priority 1: a per-request deep-link from an email (doGet forwards
    // ?page=&id= into window.__INITIAL_ROUTE). Priority 2: an explicit hash
    // from a shared link. Priority 3: role-based home.
    const initial = window.__INITIAL_ROUTE || {};
    const { page, params } = parseHash();
    if (initial.page && initial.id) {
      await navigateTo(initial.page, { id: initial.id });
    } else if (page && page !== 'home' && page !== 'login') {
      await navigateTo(page, params);
    } else {
      await navigateTo('home');
    }
  } catch (err) {
    console.error('bootstrap error:', err);
    window.__loginError = (err && err.message)
      ? err.message
      : 'Unknown error while signing in.';
    await navigateTo('login', { error: true });
  }
}


// ============================================================
// INIT
// Wired to DOMContentLoaded so the navbar elements exist by the
// time refreshNavbar() runs.
// ============================================================
window.addEventListener('hashchange', onHashChange);
window.addEventListener('DOMContentLoaded', bootstrap);
</script>
